ristophe » en 1963. Créant le journal « L'étudiant noir » en 1934 avec mes amis Damas et Senghor, je suis l'initiateur du concept de négritude que je popularise dans « Cahier d'un retour au pays natal ». Poète, député de la Martinique, une plaque me rendant hommage a été inaugurée en 2011 au panthéon.","Aime Cesaire"],["D14fe0a","dev","Ville des Pays-Bas dans laquelle s'installe en 1572 Guillaume Ier de Nassau, je suis le lieu où sont inhumés les princes de la maison d'Orange. M'étant enrichie avec l'industrie de la laine et des brasseries et le commerce de la compagnie néerlandaise des Indes orientales, je suis située entre la Haye et Rotterdam. Réputée pour mes faïences bleues, j'ai été représenté par le peintre Vermeer dans une célèbre vue.","Delft"],["D4eac41","dev","Mammifère que les pêcheurs d'une région de Mangrove de Bengladesh utilisent comme auxiliaire, je creuse une tanière appelée « Catiche ». Animal de la famille des mustélidés, je suis adapté à la vie aquatique grâce à une queue épaisse à la base qui me sert de gouvernail, à des pattes palmées et à de longues vibrisses utiles dans les zones fangeuses pour repérer les poissons. Animal à la fourrure épaisse de la tribu des lutrinés.","Le Loutre"],["D134860","dev","Ecrivain américain dont le premier roman « La traversée de l'été » fut retrouvé en 2004 vingt ans après ma disparition, je figure allonger sur un divan sur la photo de couverture des « Domaines hantés » paru en 1948. Doté d'un esprit brillant sarcastique, fréquentant des célébrités, j'ai connu un grand succès avec « Petit déjeuner chez Tiffany ». Ayant été pendant plus de cinq ans sur un fait divers pour écrire « De sang-froid ».","Truman Capote"],["Dfe230b","dev","Trouble également appelé « Stigmatisme addental » ou « stigmatisme interdental », je suis fréquent chez les enfants de moins de cinq ans et suis généralement associé à un mode de déglutition incorrecte. Provenant d'une mauvaise position de la langue et accentué si l'enfant suce son pouce, je nécessite parfois des séances d'orthophonie. Trouble de l'articulation consistant par exemple à prononcer le son « ze » à la plage du son « je ».","Zozotement/zezaiement"],["D99edc0","dev","Une couleur servant de fond à la gouache de Fernand Léger représentant des silex jaunes exécutés en 1932, je suis notamment associée à des produits de maquillage. Faisant partie des couleurs emblématiques de Coco Chanel également utilisée pour certains uniformes scout, je suis proche de différentes teintes claires telles que l'écru, le sable. Couleur de la laine naturelle entre le blanc cassé et le brun très clair.","Le Beige"],["D1614ce","dev","Pièce en sept tableaux publiée en 1948, je mets en scène un jeune intellectuel prénommé Hugo. Celui-ci entré dans le combat révolutionnaire se voit charger d'assassiner Hoederer, chef de la tendance majoritaire accusé de collaboration avec la droite par les minoritaires du parti. Œuvre de Jean Paul Sartre, j'ai été adapté au cinéma par Fernand Rivers en 1955 avec Pierre Brasseur et Daniel Gélin dans les rôles principaux.","Les Mains Sales"],["Da98fc8","dev","Chanson sortie en 1987 en même temps que le titre « A quoi tu sers? », je constitue un grand succès qui figure sur l'album « Entre gris clair et gris foncé ». Titre fonctionnant comme un dialogue entre un homme qui veut quitter son pays et une femme qui veut le retenir, je suis rythmée dans ma seconde partie avec les mots « N'y vas pas » répétés à intervalles réguliers. Chanson interprétée en duo par Jean-Jacques Goldman et Sirima.","La-bas"],["D359bd3","dev","Héros de BD qui dans un album parut fin 2018 croise des personnalités à Paris telles que Gustave Eiffel et Auguste Bartholdi, je suis dessiné par Achdé depuis 2003. Personnage qui au gré de ses aventures a côtoyé des figures historiques telles que Jesse James, Billy The Kid ou encore Calamity Jane, je vis dans l'ouest américain en compagnie de mon fidèle cheval Jolly Jumper. Célèbre cow-boy solitaire créé par Morris en 1946.","Lucky Luke"],["D7ef21a","dev","Arbre de l'hémisphère nord de l'espèce dite « aucuparia », j'ai été autrefois en Ecosse planté pour éloigner les mauvais esprits. Arbre aux feuilles composées et édentées, planté pour l'ornement et l'alignement urbain ou en sujet isolé, je suis produis en bois dur utilisé en tournerie. Portant des grappes de fruits rouge- orangés très appréciés des oiseaux et de l'industrie agroalimentaire qui en tire le sorbitol.","Le Sorbier"],["D65db45","dev","Personnage littéraire, je suis né dans l'esprit de mon créateur alors qu'il était encore lycéen à Rennes. Héros d'une pièce qui fit scandale en 1896, je suis l'officier de confiance du roi Venceslas et qu'à l'instigation de mon épouse, je fais assassiner pour m'emparer du trône. Personnage crée par Alfred Jarry, je suis un tyran lâche, cupide, vulgaire dont mes exclamations favorites sont « Merdre » et « Par ma chandelle verte ».","Ubu"],["D406bac","dev","Héroïne d'un roman publié en 1844, je me cache sous différentes identités comme celles de Charlotte Backson, d'Anne de Breuil ou de Lady Clarick. Aventurière à la beauté redoutable, j'intrigue outre Anne d'Autriche pour le cardinal Richelieu qui me charge de voler les ferrets de la reine. Aventurière qui par vengeance, empoisonne la fiancée de d'Artagnan, je finis exécutée par un bourreau dans « Les Trois mousquetaires » d'Alexandre Dumas.","Milady de Winter"],["D5e32a7","dev","Type de lieu de culte évoqué pour la première fois dans une inscription dédicatoire à Ptolémée 3, dans l'antiquité j'étais administré par un ou plusieurs notables. Rattaché en France au Consistoire central, je dispose de salles attenantes réservées aux activités intellectuelles ou sociales, mais mon bâtiment principal ne peut être utilisé que pour le culte et l'étude de la Loi. Lieu de prière de la communauté juive.","Une Synagogue"],["D4410a6","dev","Poste d'un sport collectif occupé en 1906 par Henri Lacassagne lors du premier match de l'histoire disputé par le XV de France, je suis nommé scrum-half. Requérant de la vivacité, de l'intelligence tactique, une aptitude au commandement pour diriger les avants du pack lors des phases tactiques du rugby, on m'associe notamment à Morgane Para ou encore Gareth Edwards. Formant avec le demi d'ouverture, la charnière d'une équipe de rugby à XV.","Le Demi de Melee"],["Dd28013","dev","Groupe de musique britannique auquel appartenaient lors de ma formation en 1977 le guitariste corse Henry Padovani qui sera remplacé par Andy Summers, mon premier single avait pour titre « Fall Out ». Mélangeant pop, rock, reggae, c'est en 1979 que je deviens un phénomène planétaire avec l'album « Reggatta de blanc » comprenant les tubes « Walking on the moon » et « Message in a bottle ». Groupe dont le chanteur était Sting.","The Police"],["D082a2b","dev","Moyen de paiement, imaginé en 1950 par un médecin anglais pour le personnel de sa clinique, mon idée a été reprise en France dès 1957. Comportant des mentions obligatoires comme « Le millésime » ainsi que des zones fluorescentes pour éviter la contrefaction, mon montant varie suivant les entreprises. Type de paiement permettant de déjeuner en dehors d'entreprise souvent payé à moitié par l'employeur et le salarié.","Le Titre Restaurant"],["D078c80","dev","Ville créée en 1854 sous le nom de « Port de France », j'ai été aménagée dans un espace compris entre les marécages et les collines comme celles du Ouen Toro. Située sur la côte Ouest du Nil à 1500 km de l'Australie, je donne à voir ma plage de cocotiers et la baie des citrons, la maison Célières et le centre culturel Tjibaou. Plus grande ville francophone du Pacifique, chef-lieu de la Nouvelle- Calédonie.","Noumea"],["D186107","dev","Artiste ayant chanté le théorème de Thalès en 2018 dans le cadre d'un programme destiné aux collégiens, j'ai sorti mon premier album solo en 2007. Après avoir quitté la formation « Psy4 de la rime », j'ai sorti six albums dont « Cosmopolitanie » et « Phoenix » en 2018. Rappeur marseillais auteur des tubes « Halla Halla » et « Millionnaire », mon pseudo évoque une catégorie de voix.","Soprano"],["Dca2e95","dev","Qualité dont le nom était autrefois associé au mot « catéchisme » pour la formation des enfants après la communion solennelle, je suis considérée comme une vertu pour les chrétiens. Utile pour réussir ou pour obtenir quelque chose, je nécessite de faire preuve de patience. Associée à l'idée de ténacité dans le mot « opiniâtreté », je suis la qualité d'une personne qui continue à faire ce qu'elle a décidé. Qualité de celui qui persévère.","La Perseverance"],["D1db8be","dev","Type d'appendice désigné par un terme générique et prenant le nom de « Cerques » chez le forficule, nous sommes présents chez la larve d'un insecte appelé « Chrysope ». Appendices pairs appelé « pédipalpes » chez les scorpions, nous sommes particuliers apparents chez certains crustacées. Partie antérieure des pattes du crabe, volumineux chez le homard, nous portons le nom d'un outil permettant de saisir un objet.","Les Pinces"],["Dd9f8f6","dev","Objet dont le nom figure dans le titre d'un autoportrait peint par Jules Dupré vers 1875, je suis confectionné en bois et peut avoir des formes différentes. Notamment dit « de table » ou « de campagne », je peux être réglé par un système de crémaillère pour le modèle d'atelier qui est généralement un socle en forme de H. support sur lequel un artiste travaille la toile à laquelle il travaille afin qu'elle soit à la hauteur voulue.","Le Chevalet"],["D02560a","dev","Partie de la main, dite « rouge » dans le nom d'un syndrome, je constitue l'endroit où le nerf médian se divise en ses branches terminales. Limité de chaque côté par deux saillies appelées « éminence thénar » et « hypothénar », je suis constituée intérieurement par les cinq os du métacarpe et suis située entre le poignet et la racine des doigts. Face antérieure de la main ayant une forme concave.","La Paume"],["D10affe","dev","Interjection servant de titre à une chanson de l'album « Cool frénésie » de Rita Mitsouko, je suis également utilisé dans la restauration pour faire les annonces en cuisine. Permettant d'avoir l'attention d'une personne qu'on écoute, je sers alors dans une situation où l'on a généralement que le son de la voix de son interlocuteur. Interjection conventionnelle par laquelle on commence une conversation téléphonique pour établir le contact.","Allo"],["D2e6c6a","dev","Elément chimique de numéro atomique 53, je suis utilisé pour la désinfection du matériel médical dans les antiseptiques ainsi qu'en radiologie sous forme de produits de contraste. Oligoélément présent dans les fruits de mer, les algues et certains poissons, je suis nécessaire à la synthèse des hormones et de la glande tyroïde. Souvent ajouté au sel de cuisine pour éviter les carences pouvant provoquer un goitre ou une hypothyroïdie.","L'iode"],["D629680","dev","Technique à laquelle le Louvre consacre un département depuis l'acquisition par Louis 14 de 5542 pièces en 1671, mon étude a longtemps constitué la base de l'enseignement de l'art. Art graphique, nécessitant notamment de maitriser la perspective et les lois de la proportion, je peux être pratiquée à la pierre noire, au fusain, au crayon ou au pinceau. Technique fondée sur le tracé, associée à l'esquisse ou au croquis.","Le Dessin"],["D75cad1","dev","Ecrivain français, né le 30 Juillet 1945, coscénariste du film « Lacombe Lucien », j'ai publié mon premier roman en 1967 grâce à Raymond Queneau. Développant une œuvre autour des thèmes de la mémoire et de la disparition, je situe mes romans dans les lieux parisiens parfois disparus. Auteur de « Rue des boutiques obscures », prix Goncourt en 1978, j'ai été distingué par le Prix Nobel de littérature en 2014.","Patrick Modiano"],["Dac17cf","dev","Type de personne désigné par deux mots choisis par Nâdiya en 2008 pour servir de titre à son cinquième album, je suis caractérisé par mon indépendance et ma forte personnalité. Plein d'énergie mais difficile à gérer dans une équipe, j'ai tendance à faire cavalier seul refusant l'autorité et le consensus général. Personne désignée par une expression faisant référence à une notion de physique, ayant trait à une particule.","Electron Libre"],["Dc75850","dev","Crustacé décapode de 3 à 10 cm de long vivant souvent en symbiose avec l'anémone Calliactis parasitica, je suis commun dans les fonds sablonneux et rocheux des côtes européennes. Ayant ma pince droite plus grosse que la gauche, je suis caractérisé par un abdomen mou de couleur orange-rouge. Crustacé ayant la particularité de loger dans les coquilles vides de gastéropodes comme le bulot.","Le Bernard L'hermite / le Pagure"],["D222cb6","dev","Artiste né en 1938, je triomphe dans « La belle au bois dormant » avec la troupe du Marquis de Cuevas et se forme un couple légendaire avec Margot Fonteyn et Sylvie Guillem. Remontant les ballets de Marius Petitpa de 1983 à 1989, je suis directeur de la danse de l'Opéra de Paris. Danseur et chorégraphe d'ascendance tatare ayant de nouveau dansé au Kirov vingt-huit ans après avoir demandé asile à la France en 1961 par Nijinski.","Rudolf Noureïev"],["Dc2bfa6","dev","Traité signé par la France par Christian Pineau et Maurice Faure après neuf mois de négociations, je comprenais notamment six parties notamment consacrées à des dispositions sociales et financières. Finalisé au Capitole, j'ai été signé le 25 Mars 1957 par les six pays européens déjà membre de la Communauté Européenne du Charbon et de l'Acier. Ayant institué la Communauté Economique Européenne, associé à la capitale de l'Italie.","Le Traite de Rome"],["Dbd8ce4","dev","Objet d'un sport, mon nom est attesté en français dès 1534 chez Rabelais qui me dit fabriqué pour Gargantua. Pouvant être manipulé en deux temps et maintenu jusqu'au moment où toutes les parties du corps sont immobiles, je suis une barre sur laquelle sont enfilés des disques de fonte rouge pour 25kilos, bleu pour 20 kilos. Permettant notamment de réaliser un épaulé jeté.","L'haltere"],["Dbf6a52","dev","Pilote de moto né en 1942, je fais mes débuts sur le continental Circus en 1964 et suis recruté l'année suivante par la firme Agusta qui deviendra célèbre grâce à mes exploits. Dix fois vainqueur du Tourist Trophy de l'île de Man, je mène des courses les plus dangereuses du monde et remporté près de 350 et 500 cm3, quinze titres mondiaux et cent vingt-deux victoires en Grand Prix. Pilote italien, plus grand champion de motocycliste de l'histoire.","Giacomo Agostini"],["D513bac","dev","Insecte auquel est apparenté le « Dorcus parallelipipedus », je suis le plus grand coléoptère de France. Ayant une lente en forme de C qui vit dans les troncs des compositions, je suis pourvu d'un corps robuste et luisant noir ou brun roussâtre et je peux mordre lorsqu'on m'attrape. Coléoptère dont le mâle porte de fortes mandibules branchues évoquant les ramures d'un cerf.","Le Cerf Volant / le Lucane"],["D523c09","dev","Romancière née à Steventon en 1775, issue d'une famille nombreuse, mes romans dépeignent la société anglaise du 18ème et 19ème siècle. Caractérisée par mon ironie et mon humour décalé, j'ai publié anonymement mon premier roman « Raison et sentiments ». Ayant pour thème privilégié le mariage et la condition féminine, j'ai été incarnée au cinéma en 2007 par Anne Hathaway dans une biographie romancée. Auteur de « Orgueil et Préjugés ».","Jane Austen"]];

/* ---------- Cartes (documents de Daniel) : [id, source, question, réponse] ---------- */
var SRC = { gil: "Questions de Gilles", ecl: "Éclairs", dev: "Je suis…" };
var SRC_LONG = { gil: "Questions de Gilles", ecl: "Éclairs · Cahier d’un génie", dev: "« Je suis… » · Cahier d’un génie" };
var CMAP = {}; CARDS.forEach(function (c) { CMAP[c[0]] = c; });

/* ---------- État et rappel espacé (méthode Leitner) ---------- */
var KEY = "cultureg-v1";
var INTERVALS = [0, 1, 3, 7, 14, 30];
var SESSION_SIZE = 5;
var CARD_SIZE = 10;
var LEVELS = [["Curieux", 0], ["Initié", 20], ["Averti", 80], ["Érudit", 250], ["Expert", 600], ["Stratosphérique", 1200]];

function todayNum() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function load() {
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.cards) { s.flags = s.flags || {}; if (s.doneCards === undefined) s.doneCards = -1; return s; }
  } catch (e) {}
  return { cards: {}, flags: {}, score: 0, streak: 0, lastDay: -1, doneDay: -1, doneCards: -1 };
}
var S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

var QMAP = {}; QS.forEach(function (q) { QMAP[q[0]] = q; });
function known(id) { return !!(QMAP[id] || CMAP[id]); }
function mastered() { return Object.keys(S.cards).filter(function (id) { return known(id) && S.cards[id].box >= 4; }).length; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function dueIds(kind) {
  var t = todayNum(), map = kind === "card" ? CMAP : QMAP;
  var ids = Object.keys(S.cards).filter(function (id) { return map[id] && S.cards[id].due <= t; });
  return shuffle(ids).sort(function (a, b) { return S.cards[a].box - S.cards[b].box; });
}
function newQcmIds(prefCat) {
  var fresh = QS.filter(function (q) { return !S.cards[q[0]]; });
  fresh.sort(function (a, b) { return (b[1] === prefCat) - (a[1] === prefCat); });
  return fresh.map(function (q) { return q[0]; });
}
function newCardIds() { return shuffle(CARDS.filter(function (c) { return !S.cards[c[0]]; }).map(function (c) { return c[0]; })); }
function todayCap() { return CAPS[todayNum() % CAPS.length]; }
function currentStreak() { return (S.lastDay >= todayNum() - 1) ? S.streak : 0; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/* ---------- Interface ---------- */
var tab = "today";
var run = null; // session en cours
var viewEl = document.getElementById("view");

function renderChrome() {
  var d = new Date();
  document.getElementById("date").textContent = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("stats").innerHTML =
    '<div class="stat streak"><b>' + currentStreak() + '</b><span>Série (j)</span></div>' +
    '<div class="stat"><b>' + S.score + '</b><span>Points</span></div>' +
    '<div class="stat"><b>' + mastered() + '</b><span>Acquises</span></div>';
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  });
}

function startButtons(doneQ, doneC) {
  var dq = dueIds("qcm").length, dc = dueIds("card").length;
  return '<div class="card"><h3>Ta séance du jour</h3>' +
    '<button class="btn" data-act="start">' + (doneQ ? "Quiz du jour : fait" : "Quiz du jour · " + SESSION_SIZE + " QCM") + '</button>' +
    '<p class="note">' + (doneQ ? "Un quiz bonus est possible dans l’onglet Quiz." : (dq ? dq + " à réviser · " : "") + "choix multiples sur la capsule") + '</p>' +
    '<button class="btn ghost" data-act="startcards">' + (doneC ? "Cartes éclair : fait" : "Cartes éclair · " + CARD_SIZE) + '</button>' +
    '<p class="note">' + (dc ? dc + " carte" + (dc > 1 ? "s" : "") + " à réviser · " : "") + 'questions de tes documents, tu te notes toi-même</p></div>';
}

function dayPicks() {
  var pool = CARDS.filter(function (c) { return c[1] !== "dev" && c[2].length < 170 && c[3].length < 50; });
  var t = todayNum(), out = [];
  for (var i = 0; i < 5; i++) out.push(pool[(t * 7919 + i * 1291) % pool.length]);
  return out;
}

function renderToday() {
  var c = todayCap();
  var picks = dayPicks().map(function (p) { return '<li><span class="pq">' + esc(p[2]) + '</span><b class="pa">' + esc(p[3]) + '</b></li>'; }).join("");
  var facts = c.facts.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("");
  viewEl.innerHTML =
    '<div class="card"><span class="tag">Capsule du jour · ' + CATS[c.cat] + '</span><h2>' + esc(c.title) + '</h2>' +
    '<ul class="facts">' + facts + '</ul><div class="link">' + c.link + '</div></div>' +
    '<div class="card"><span class="tag">À retenir aujourd’hui</span><ul class="picks">' + picks + '</ul></div>' +
    startButtons(S.doneDay === todayNum(), S.doneCards === todayNum());
}

function buildSession(kind, bonus) {
  var ids;
  var all = kind === "card" ? CARDS.map(function (c) { return c[0]; }) : QS.map(function (q) { return q[0]; });
  var size = kind === "card" ? CARD_SIZE : SESSION_SIZE;
  if (bonus) {
    ids = shuffle(all).slice(0, size);
  } else {
    ids = dueIds(kind).slice(0, size);
    var fresh = kind === "card" ? newCardIds() : newQcmIds(todayCap().cat);
    if (ids.length < size) ids = ids.concat(fresh.slice(0, size - ids.length));
    if (ids.length < size) {
      var extra = shuffle(all.filter(function (id) { return ids.indexOf(id) < 0; }));
      ids = ids.concat(extra.slice(0, size - ids.length));
    }
  }
  return { kind: kind, ids: ids, i: 0, right: 0, answered: null, revealed: false, bonus: !!bonus, finished: false };
}

function bumpCard(id, good) {
  var t = todayNum();
  var c = S.cards[id] || { box: 0, due: t, right: 0, wrong: 0 };
  if (good) { c.box = Math.min(5, c.box + 1); c.due = t + INTERVALS[c.box]; c.right++; }
  else { c.box = 0; c.due = t; c.wrong++; }
  S.cards[id] = c;
}

function renderResult() {
  var streak = currentStreak(), n = run.ids.length;
  var msg = run.right === n ? "Sans faute." : run.right >= n * 0.6 ? "Solide. Ce que tu as raté revient très vite." : "Ce que tu as raté revient très vite, c’est comme ça que ça rentre.";
  viewEl.innerHTML = '<div class="card"><span class="tag">Session terminée</span><div class="result-score">' + run.right + '/' + n + '</div>' +
    '<p style="margin:0">' + msg + '</p>' +
    '<p class="note">Série en cours : ' + streak + ' jour' + (streak > 1 ? "s" : "") + '. Points : ' + S.score + '.</p>' +
    '<button class="btn" data-act="home">Retour à l’accueil</button>' +
    '<button class="btn ghost" data-act="' + (run.kind === "card" ? "morecards" : "bonus") + '">' + (run.kind === "card" ? "10 cartes de plus" : "Quiz bonus") + '</button></div>';
}

function renderQuiz() {
  if (!run) {
    viewEl.innerHTML = startButtons(S.doneDay === todayNum(), S.doneCards === todayNum()) +
      '<div class="card"><button class="btn ghost" data-act="bonus">Quiz bonus (5 QCM au hasard)</button><button class="btn ghost" data-act="morecards">Cartes au hasard (10)</button></div>';
    return;
  }
  if (run.finished) { renderResult(); return; }
  if (run.kind === "card") { renderCard(); return; }
  var q = QMAP[run.ids[run.i]];
  if (!run.order || run.orderFor !== run.i) { run.order = shuffle([0, 1, 2, 3]); run.orderFor = run.i; }
  var opts = run.order.map(function (k) {
    var cls = "opt", dis = "";
    if (run.answered !== null) {
      dis = " disabled";
      if (k === 0) cls += " ok"; else if (k === run.answered) cls += " bad"; else cls += " dim";
    }
    return '<button class="' + cls + '" data-opt="' + k + '"' + dis + '>' + esc(q[3][k]) + '</button>';
  }).join("");
  var after = "";
  if (run.answered !== null) {
    var good = run.answered === 0;
    after = '<p class="verdict ' + (good ? "ok" : "bad") + '">' + (good ? "Bonne réponse, +10 points" : "Pas cette fois. Bonne réponse : " + esc(q[3][0])) + '</p>' +
      '<p class="explain">' + esc(q[4]) + '</p>' +
      '<button class="btn" data-act="next">' + (run.i + 1 < run.ids.length ? "Question suivante" : "Voir le résultat") + '</button>';
  }
  var pct = Math.round((run.i + (run.answered !== null ? 1 : 0)) / run.ids.length * 100);
  viewEl.innerHTML = '<div class="card"><div class="qhead"><span>Question ' + (run.i + 1) + ' / ' + run.ids.length + '</span><span>' + CATS[q[1]] + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="question">' + esc(q[2]) + '</div><div class="opts">' + opts + '</div>' + after + '</div>';
}

function renderCard() {
  var c = CMAP[run.ids[run.i]];
  var pct = Math.round((run.i + (run.revealed ? 1 : 0)) / run.ids.length * 100);
  var long = c[2].length > 230 ? " long" : "";
  var body;
  if (!run.revealed) {
    body = '<button class="btn" data-act="reveal">Voir la réponse</button>';
  } else {
    var fl = S.flags[c[0]];
    body = '<div class="ansbox"><span class="tag">Réponse</span><div class="answer">' + esc(c[3]) + '</div></div>' +
      '<div class="row2"><button class="btn ghost" data-act="again">À revoir</button><button class="btn" data-act="know">Je savais</button></div>' +
      '<button class="flagbtn" data-act="flag">' + (fl ? "Signalée comme douteuse (toucher pour annuler)" : "Réponse douteuse ? Signaler") + '</button>';
  }
  viewEl.innerHTML = '<div class="card"><div class="qhead"><span>Carte ' + (run.i + 1) + ' / ' + run.ids.length + '</span><span>' + SRC[c[1]] + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="question' + long + '">' + esc(c[2]) + '</div>' + body + '</div>';
}

function finishSession() {
  run.finished = true;
  var t = todayNum();
  var normal = !run.bonus;
  if (normal && run.kind === "card") S.doneCards = t; else if (normal) S.doneDay = t;
  if (S.lastDay < t) { S.streak = (S.lastDay === t - 1) ? S.streak + 1 : 1; S.lastDay = t; }
  save(); renderChrome(); renderQuiz();
}

function answer(k) {
  if (!run || run.answered !== null) return;
  run.answered = k;
  if (k === 0) { S.score += 10; run.right++; }
  bumpCard(run.ids[run.i], k === 0);
  save(); renderChrome(); renderQuiz();
}

function rateCard(good) {
  if (!run || !run.revealed) return;
  bumpCard(run.ids[run.i], good);
  if (good) { S.score += 5; run.right++; }
  save();
  if (run.i + 1 < run.ids.length) { run.i++; run.revealed = false; renderChrome(); renderQuiz(); }
  else finishSession();
}

function nextQ() {
  if (run.i + 1 < run.ids.length) { run.i++; run.answered = null; renderQuiz(); return; }
  finishSession();
}

function encodeState() { try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ""; } }
function decodeState(txt) {
  var o = JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));
  if (!o || typeof o.cards !== "object") throw new Error("bad");
  o.flags = o.flags || {}; if (o.doneCards === undefined) o.doneCards = -1;
  return o;
}
function copyText(text, boxId, msgId, okMsg) {
  var ta = document.getElementById(boxId), msg = document.getElementById(msgId);
  ta.value = text;
  var done = function () { msg.textContent = okMsg; };
  var fail = function () { ta.focus(); ta.select(); msg.textContent = "Sélectionne le texte et copie-le."; };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); }
}

function renderProgress() {
  var m = mastered(), lvl = LEVELS[0], next = null;
  LEVELS.forEach(function (l, i) { if (m >= l[1]) { lvl = l; next = LEVELS[i + 1] || null; } });
  var rows = Object.keys(CATS).map(function (k) {
    var tot = QS.filter(function (q) { return q[1] === k; });
    var ok = tot.filter(function (q) { return S.cards[q[0]] && S.cards[q[0]].box >= 4; }).length;
    var seen = tot.filter(function (q) { return S.cards[q[0]]; }).length;
    return '<div class="cat"><span>' + CATS[k] + '</span><em>' + ok + ' acquises · ' + seen + '/' + tot.length + ' vues</em><div class="bar"><i style="width:' + (tot.length ? Math.round(ok / tot.length * 100) : 0) + '%"></i></div></div>';
  }).join("");
  var srows = Object.keys(SRC_LONG).map(function (k) {
    var tot = CARDS.filter(function (c) { return c[1] === k; });
    var ok = tot.filter(function (c) { return S.cards[c[0]] && S.cards[c[0]].box >= 4; }).length;
    var seen = tot.filter(function (c) { return S.cards[c[0]]; }).length;
    return '<div class="cat"><span>' + SRC_LONG[k] + '</span><em>' + ok + ' acquises · ' + seen + '/' + tot.length + ' vues</em><div class="bar"><i style="width:' + (tot.length ? Math.round(ok / tot.length * 100) : 0) + '%"></i></div></div>';
  }).join("");
  var r = 0, w = 0; Object.keys(S.cards).forEach(function (id) { r += S.cards[id].right; w += S.cards[id].wrong; });
  var acc = (r + w) ? Math.round(r / (r + w) * 100) + " %" : "pas encore";
  var nflag = Object.keys(S.flags).filter(function (id) { return S.flags[id] && CMAP[id]; }).length;
  viewEl.innerHTML =
    '<div class="card level"><span class="tag">Niveau</span><h2>' + lvl[0] + '</h2><p class="note">' +
    (next ? (next[1] - m) + ' question' + ((next[1] - m) > 1 ? "s" : "") + ' à maîtriser pour atteindre « ' + next[0] + ' ».' : "Niveau maximum atteint.") +
    ' Précision globale : ' + acc + '.</p></div>' +
    '<div class="card"><span class="tag">Quiz par domaine</span><div class="cats">' + rows + '</div></div>' +
    '<div class="card"><span class="tag">Cartes par document</span><div class="cats">' + srows + '</div></div>' +
    '<div class="card"><span class="tag">Réponses douteuses</span><p class="note">' + nflag + ' carte' + (nflag > 1 ? "s" : "") + ' signalée' + (nflag > 1 ? "s" : "") + '. Les documents d’origine peuvent contenir des erreurs ou des infos dépassées : copie la liste et envoie-la moi pour vérification.</p>' +
    '<div class="row"><button class="btn small ghost" data-act="copyflags">Copier la liste</button></div><p class="msg" id="msg2" aria-live="polite"></p></div>' +
    '<div class="card"><span class="tag">Sauvegarde</span><p class="note">Ta progression est gardée dans ce navigateur. Copie ce code de temps en temps pour la retrouver si tes données sont effacées.</p>' +
    '<div class="row"><button class="btn small" data-act="copy">Copier mon code</button></div>' +
    '<textarea id="code" aria-label="Code de sauvegarde ou liste" placeholder="Colle ici un code pour restaurer ta progression"></textarea>' +
    '<div class="row"><button class="btn small ghost" data-act="import">Restaurer</button></div><p class="msg" id="msg" aria-live="polite"></p></div>';
}

function render() {
  renderChrome();
  if (tab === "today") renderToday(); else if (tab === "quiz") renderQuiz(); else renderProgress();
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.opt !== undefined) { answer(parseInt(t.dataset.opt, 10)); return; }
  var a = t.dataset.act; if (!a) return;
  if (a === "start" || a === "bonus") { run = buildSession("qcm", a === "bonus"); tab = "quiz"; render(); }
  else if (a === "startcards" || a === "morecards") { run = buildSession("card", a === "morecards"); tab = "quiz"; render(); }
  else if (a === "next") nextQ();
  else if (a === "reveal") { run.revealed = true; renderQuiz(); }
  else if (a === "know") rateCard(true);
  else if (a === "again") rateCard(false);
  else if (a === "flag") { var id = run.ids[run.i]; if (S.flags[id]) delete S.flags[id]; else S.flags[id] = 1; save(); renderQuiz(); }
  else if (a === "home") { run = null; tab = "today"; render(); }
  else if (a === "copy") copyText(encodeState(), "code", "msg", "Code copié. Garde-le dans tes notes.");
  else if (a === "copyflags") {
    var lines = Object.keys(S.flags).filter(function (id) { return S.flags[id] && CMAP[id]; }).map(function (id) { return CMAP[id][2] + " → " + CMAP[id][3]; });
    copyText(lines.length ? lines.join("\n") : "Aucune carte signalée.", "code", "msg2", lines.length ? "Liste copiée." : "Aucune carte signalée pour l’instant.");
  } else if (a === "import") {
    var box = document.getElementById("code"), m2 = document.getElementById("msg");
    try { S = decodeState(box.value); save(); renderChrome(); m2.textContent = "Progression restaurée."; }
    catch (err) { m2.textContent = "Code non reconnu. Vérifie que tu l’as collé en entier."; }
  }
});
render();

try {
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js");
} catch (e) {}
</script>
