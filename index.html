<style>
/* Concept : une appli de poche, une capsule + 5 questions par jour, couleurs du drapeau togolais (vert profond, or, rouge) sur fond neutre vert-gris. */
:root {
  --bg: #F1F5F2;
  --surface: #FFFFFF;
  --fg: #10201A;
  --muted: #566860;
  --line: #D3DDD7;
  --accent: #0E6B50;
  --accent-fg: #FFFFFF;
  --gold: #B8800B;
  --ok: #17784F;
  --ok-bg: #DDF1E7;
  --bad: #B3322F;
  --bad-bg: #F9E1E0;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1612; --surface: #15231C; --fg: #E7F0EB; --muted: #94A99F; --line: #28392F;
    --accent: #4FC596; --accent-fg: #07140E; --gold: #F0B93A;
    --ok: #55CC9B; --ok-bg: #12382A; --bad: #F08080; --bad-bg: #3B1B1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1612; --surface: #15231C; --fg: #E7F0EB; --muted: #94A99F; --line: #28392F;
  --accent: #4FC596; --accent-fg: #07140E; --gold: #F0B93A;
  --ok: #55CC9B; --ok-bg: #12382A; --bad: #F08080; --bad-bg: #3B1B1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
header h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
header .date { color: var(--muted); font-size: 15px; text-transform: capitalize; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat.streak b { color: var(--gold); }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font-weight: 700; color: var(--muted); min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.tag { display: inline-block; align-self: flex-start; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.card h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.facts li { padding-left: 16px; position: relative; }
.facts li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.link { border-top: 1px dashed var(--line); padding-top: 12px; color: var(--muted); font-size: 15.5px; }
.link b { color: var(--fg); }

.btn { border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; padding: 14px 18px; border-radius: 14px; min-height: 52px; font-size: 18px; width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.small { width: auto; min-height: 44px; font-size: 16px; padding: 10px 16px; }
.note { color: var(--muted); font-size: 15px; margin: 0; }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.question { font-family: var(--font-display); font-size: 23px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; min-height: 52px; font-weight: 600; }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--fg); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--fg); }
.opt.dim { opacity: .55; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.explain { margin: 0; color: var(--muted); }
.result-score { font-family: var(--font-display); font-size: 56px; font-weight: 800; line-height: 1; }

.level { display: flex; flex-direction: column; gap: 8px; }
.level h2 { font-size: 30px; }
.cats { display: flex; flex-direction: column; gap: 12px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.cat span { font-weight: 600; }
.cat em { font-style: normal; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.cat .bar { grid-column: 1 / -1; }
textarea { width: 100%; min-height: 84px; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.msg { font-size: 15px; color: var(--accent); min-height: 1.4em; margin: 0; }

.question.long { font-size: 18px; line-height: 1.4; font-weight: 600; }
.card h3 { font-size: 21px; font-weight: 800; }
.ansbox { background: var(--ok-bg); border: 1.5px solid var(--ok); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.ansbox .tag { color: var(--ok); }
.answer { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flagbtn { background: transparent; border: 0; color: var(--muted); font-size: 14.5px; text-decoration: underline; padding: 8px 0; min-height: 44px; text-align: left; }
.picks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.picks li { display: flex; flex-direction: column; gap: 2px; border-bottom: 1px dashed var(--line); padding-bottom: 12px; min-width: 0; }
.picks li:last-child { border-bottom: 0; padding-bottom: 0; }
.pq { color: var(--muted); font-size: 15.5px; }
.pa { font-family: var(--font-display); font-size: 19px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>

 tête découverte peut-on faire dormir les bébés?","La gigoteuse"],["E16cc40","ecl","Quel magicien hypnotiseur créé en 1934 par Lee Falk et Phil Davis est neutralisé dès qu'on lui bande les yeux?","Mandrake"],["E22f9dd","ecl","Sous quel nom français connait-on Ororo Munroe alias Storm, la super héroïne de l'équipe des X-men qui souffre de claustrophobie?","Tornade"],["Ec301db","ecl","Par quel mot composé désigne-t-on le petit morceau de carton ou de papier qui permet de retrouver l'endroit où l'on a arrêté sa lecture?","Le marque-page"],["Eb4420e","ecl","Quel pupitre place-t-on dans le cœur d'une église pour porter des livres de chants liturgiques?","Le lutrin"],["E3d149f","ecl","Dans l'antiquité, quel esclave était chargé de faire la lecture pendant le repas chez les riches romains?","L'anagnoste"],["E135ae1","ecl","Quel musée de Londres abrite une salle de lecture de forme circulaire conçu par l'architecte Sydney Smirke et ouverte au public en 1857?","British Muséum"],["E70838f","ecl","Au rugby, quel nom donne-t-on au coup de pied qui ne peut être effectué qu'après avoir marqué un essai?","Une transformation"],["Ec7a0de","ecl","Quelle espèce d'araignée de la région méditerranéenne également appelée « Malmignatte » est la seule espèce venimeuse en France?","La veuve noire"],["E9869b8","ecl","Dans le roman Don Quichotte, quel personnage de paysan monté sur son âne accompagne le héros?","Sancho Panza"],["Ee539b5","ecl","Quelle locution signifiant pour un commerçant d'avoir une situation bien établie se réfère à une partie de la façade qu'autrefois les gens aisés décoraient pour afficher leur richesse?","Avoir pignon sur rue"],["E326965","ecl","En 1875 en France, quelle République est officiellement consacrée par le vote de trois 3ème lois constitutionnelles?","La République"],["E10d2d4","ecl","En médecine, comment appelle-t-on les structures composées de cartilages fibreux qui réunissent les vertèbres et jouent entre elles le rôle d'amortisseurs?","Les disques"],["Ecc715b","ecl","Quel nom portent les nuages à base sombre pouvant mesurer plus de 9000 mètres de hauteur qui donnent des averses ou des orages?","Les cumulonimbus"],["E898570","ecl","Quel nom féminin pluriel désigne un ouvrage rapportant les évènements année après année?","Les annales"],["Dd48a3f","dev","Révolutionnaire français né en 1746, je retrouve en 1792 neuf ans après avoir dû vendre ma charge de procureur mon poste dans la magistrature grâce à Camille Desmoulins. Ayant la réputation d'une rigueur implacable, je dois mon surnom de « pourvoyeur de la guillotine » au grand nombre de personnes que je fis exécuter. Révolutionnaire ayant été l'accusateur public du tribunal révolutionnaire.","Fouquier-tinville"],["D76a4bb","dev","Type d'action dont le nom est étymologiquement lié à un verbe signifiant « aller çà et là », je fais la loi lorsque je suis commune selon un adage du droit. Devant être pardonné selon Voltaire tout en aimant la vérité, je peux être féconde dans les sciences expérimentales et suis inhérente au processus scientifique. Fait de se tromper ou résultat erroné, pouvant être dit « de jeunesse » « de calcul » ou « de jugement ».","Une Erreur"],["Dd9665d","dev","Réalisateur étranger dont le troisième long métrage « Au feu les pompiers » terminé en 1967 a été sauvé par Claude Berry, je me suis ensuite établi aux USA. Ne rencontrant pas le succès escompté avec « Valmont » sorti après « Les Liaisons Dangereuses », je reçus l'oscar du meilleur réalisateur pour « Vol au-dessus d'un nid de coucou » et « Amadeus ». Réalisateur d'origine tchécoslovaque disparut en 2018.","Milos Forman"],["Dfd1d00","dev","Groupe socioprofessionnel, je suis régi par un statut général défini originellement en France en 1946 et refondu dans les années 1980. Composé d'environ 500 métiers, je suis le premier employeur de France avec 5,5 millions de personnes. Comptant les catégories dites d'Etat, territoriales ou territoriales auxquelles s'ajoutent des statuts particuliers, je suis composé de postes impliquant la gestion des affaires publiques.","La Fonction Publique"],["D234e51","dev","Roman, paru originellement en 1913 dans la nouvelle revue française, j'ai manqué d'une voix le prix Goncourt la même année et je compte notamment les personnages de De Gallet et de Valentine Blondeau. A la fois roman d'initiation au récit poétique, je mets en scène un élève mystérieux qui fait partager au narrateur François Seurel ses rêves d'aventure et sa quête d'un amour absolu. Unique roman d'Alain Fournier.","Le Grand Meaulnes"],["D9d15ef","dev","Ecrivain né à Tinchebray en 1896, je suis un étudiant en médecine passionné par la psychiatrie lorsque je suis mobilisé à Nantes où je fais la rencontre décisive de Jacques Vachet. Lecteur de Lautréamont et de Freud, je fonde avec Aragon et Soupo la revue « Littérature » et écrit avec ce dernier « les Champs Magnétiques », un ensemble de textes automatiques. Auteur de « L'Amour fou », « Du manifeste du surréalisme » ou encore « Nadja ».","Andre Breton"],["D5c5d37","dev","Type de tissus du corps humain, pouvant être dits « de Offa » ou « de Bertin », je forme un faisceau fibreux principalement composé de molécules de collagène. De couleur blanchâtre, je suis légèrement élastique et d'une grande résistance afin d'assurer plusieurs sortes de liaisons, mais peut être endommagé par la distension ou la déchirure que constitue une entorse. Bande de tissus conjonctifs entourant les articulations.","Le Ligament"],["D3bf56f","dev","Actrice, récompensée par un César d'honneur en 2014 à l'âge de 29 ans alors que j'avais joué dans une trentaine de films, j'ai également chanté dans le groupe « The Singles ». Erigée pour la troisième fois par Woody Allen dans « Vicky Cristina Barcelona », j'ai tenu le rôle principal de Lucy de Luc Besson. Américaine ayant interprétée plusieurs fois la veuve noire notamment dans le dernier des Avengers sorti en 2018.","Scarlett Johansson"],["D707199","dev","Elément de construction dont un modèle qualifié de « mécanique » fut breveté en 1841 par les frères Gilardoni. Dit à faible gamme, canal ou emboitement selon ma forme qui est souvent caractéristique d'une région, je peux avoir une couleur rose, rouge ou brune. Elément généralement en terre cuite utilisé pour couvrir les bâtiments.","La Tuile"],["D98eb48","dev","Ondes dont la polarisation a été mise en évidence par le physicien Charles Glover Barkla, nous pouvons être produits dans des tubes de Coolidge. Figurant dans le spectre électromagnétique aux cotés des UV, nous sommes couramment utilisés pour le contrôle des bagages et dans la radiographie médicale. Ondes découvertes par le physicien Wilhelm Roentgen qui nous a associé à une lettre de l'alphabet en raison de notre nature inconnue.","Rayons X"],["D967c80","dev","Roman français publié en 1846. J'ai pour cadre la région du Berry et met en scène un laboureur devenu veuf germain qui désire se remarier pour le bien de ses enfants. Rencontrant une jeune fille de 16 ans, Marie, qui se rend dans une ferme pour y être servante, il est touché par sa gentillesse. Roman champêtre de Georges Sand constituant un plaidoyer en faveur du peuple paysan et de ses vertus.","La Mare Au Diable"],["D747dd9","dev","Ile de la Méditerranée, d'une superficie de 572 km², située à environ 101 km du cap de la Nau, j'ai été colonisée par les Carthaginois au 7ème siècle avant notre ère. Ile dont les sites archéologiques de Sa Caleta et de Puig Des Molins ainsi que les fortifications du 16ème siècle dont ma ville principale sont classées au patrimoine mondial de l'UNESCO, j'appartiens à l'archipel des Baléares. Appelée « Eivissa » en Catalan.","Ibiza"],["Defcf1d","dev","Singe reconnu comme une espèce nouvelle en 1929 grâce aux recherches de l'anatomiste allemand Ernst Schwartz, je vis uniquement dans les forêts humides de l'ex-Zaïre. Vivant dans un groupe fonctionnant sur un mode matriarcal et moins hiérarchisé que celui des autres espèces de singe, mes représentants partagent équitablement la nourriture et substituent la sexualité à la violence. Singe parfois appelé « Chimpanzé-nain »","Le Bonobo"],["D442a4b","dev","Type d'écriture. Les anglais l'appellent « Black Letter » et des lettres noires une de mes formes. Graphique de l'alphabet latin utilisé à partir du 12ème siècle ayant succédé à la minuscule caroline, j'ai été choisi par Gutenberg pour l'impression de sa bible. Ecriture que l'on utilise plus qu'à des fins ornementales et dont les lettres présentent des traits droits et anguleux.","Ecriture Gothique"],["D0c0c23","dev","Cuisine d'un pays, inscrite en 2010 au patrimoine immatériel de l'UNESCO, je comprends une sorte de papillote, le Tamal. Gastronomie dont le plat national le Mole Poblano est à base de dinde relevée de sauce au chocolat, je fais également le Quessadillas, les Chilaquiles et la « Torta Ahogada ». Cuisine d'un pays d'Amérique dans laquelle le maïs joue un rôle essentiel notamment dans les tortillas.","Cuisine Mexicaine"],["D45e275","dev","Type d'image dont le nom est issu d'un mot du balatin signifiant « Retour en arrière », je suis le résultat d'un phénomène optique de renvoi d'une partie de la lumière. N'étant pas reconnu au début par un enfant au bas âge même s'il prend plaisir à me regarder, je suis inversé par rapport à la réalité. Image d'un objet ou d'une personne que l'on voit dans de l'eau ou dans un miroir.","Le Reflet"],["De17e1a","dev","Comédien ayant grandi dans le petit village de Tal, j'ai reçu en 1977 le Golden Globe du meilleur espoir masculin pour mon interprétation dans « Stay and Going », souvent cantonné à des rôles physiques du fait de ma morphologie, j'ai également dans des comédies comme « Jumeaux », « Un flic à la maternelle » et « La course aux jouets ». Également homme politique, devenu star grâce à « Conan le barbare » et « Terminator ».","Arnold Schwarzenegger"],["Dbb6baf","dev","Club de sport, fondé en 1883, restructuré pour prendre ma forme actuelle en 1995, je suis le seul club de rugby à avoir été champion de France sur trois siècles différents. Présidé dès 1992 par Max Guazzini, associé depuis une dizaine d'années à un maillot de couleur rose, j'évolue à domicile au stade Jean-Bouin. Club de rugby parisien ayant conquis en 2015 le 14ème titre de champion de France dans mon histoire.","Le Stade Français"],["D076e05","dev","Arbre déjà cultivé en Chine il y a 4000 ans sous le nom de « xìng », j'ai pour nom scientifique « Prunus armeniaca ». Haut de 6 à 8 mètres, je fleuris précocement, ce qui me rend vulnérable aux gelées printanières. Arbre fruitier cultivé en France dont une de mes variétés est appelée « Rouge du Roussillon » donnant des fruits à la peau duveteuse de couleur orange à la chair ferme, parfumée sucrée parfois appelée « aubercot »","L'abricotier"],["D9067cf","dev","Objet ayant été commercialisé aux USA dès 1929, je deviens dès les années 30 un accessoire de mode grâce aux acteurs de cinéma. Classé en 5 catégories notées de 0 à 4 qui permettent d'adapter mon utilisation aux conditions extérieures, je suis différent si une de mes parties est teintée en surface ou dans la masse. Paire de verres protecteurs enchâssés dans une monture destinée à préserver les yeux de la luminosité.","Les Lunettes de Soleil"],["Dda7022","dev","Type de représentation à laquelle on associe des artistes comme Fritz Willis et Gilles Elvgren, je suis désigné par un anglicisme. En vogue aux USA dès le début du XXème siècle, j'ai eu pour modèles des actrices comme Rita Haiworth ou Bettie Page. Représentation de jolies femmes au physique avantageux souvent peu vêtues.","Les Pin-up"],["Dd1bef3","dev","Système d'écriture dont seuls trois codex conservés à Paris, Madrid et Dresde ont échappé à un autodafé en 1562, j'étais utilisé dès le 5ème siècle avant notre ère. Ecriture mésoaméricaine, constituée de quelques mille signes et support d'une vingtaine de langues, j'étais déchiffré à la fin des années 90 à la suite d'un travail pluridisciplinaire. Ecriture d'une civilisation précolombienne de la presqu'île du Yucatan.","Ecriture Maya"],["Db18b58","dev","Roman de Jules Verne, publié en feuilletons en 1874, je raconte les aventures de l'ingénieur Cyrus Smith et de ses compagnons évadés en aérostat après leur participation à la guerre de Sécession. Faisant réapparaitre le capitaine Némo qui apporte discrètement son aide aux naufragés pendant 4 ans avant de mourir, je suis suivi par une éruption volcanique. Roman de Jules Verne dont l'action se passe sur une île du Pacifique.","L'ile Mysterieuse"],["D1709ac","dev","Terme, qualifié par Baudelaire de mot affreux et bizarre, je suis emprunté à l'allemand signifiant « manière qui convient ». Appliqué en art à la facilité à peindre un tableau sans modèle, je sers dans mon sens courant à qualifier une personne habillée avec goût et élégance. Mot d'une syllabe associée à la mode française et à la haute-couture parisienne, je corresponds au « C » de l'abréviation BCBG.","Chic"],["D3ee3af","dev","Pièce d'un logement constituant en 1985 le titre d'un roman de Jean Philippe Toussaint, un de mes modèles a été aménagé en 1920 par le décorateur Armand-Albert Rateau pour la couturière Jeanne Lanvin. Pièce qui selon une récente étude est après la cuisine, la deuxième pièce préférée des français, j'étais encore considérée comme un luxe au 19ème siècle. Endroit pouvant être équipé d'une douche à l'italienne.","La Salle de Bain"],["D3e7366","dev","Genre musical né dans la seconde partie du 17ème siècle, la pièce la Princesse de Navarre, écrite par Voltaire en 1743 constitue l'une de mes rares persistances; traitant de sujets contemporains, ayant le mariage pour intrigue centrale, j'ai pour exemples certaines œuvres de Molière comme Pastorale comique et les Fâcheux; indissociable du duo Molière / Lully, je mêle la danse et la musique au cœur d'une action dramatique.","La Comedie- Ballet"],["Dbfaf7f","dev","Lieu dont le nom figure dans le titre d'un ouvrage de Bernard Moitessier paru en 1967, j'ai été reconnu en 1616 par des navigateurs hollandais. Auto-falaise dont le nom est associé à une ville du continent américain, je suis un passage redouté des marins du fait des tempêtes fréquentes auxquelles je suis soumise. Promontoire du Chili, constituant le point le plus austral de l'Amérique du Sud, située à l'extrémité sud de l'archipel de la Terre de feu.","Le Cap Horn"],["D4574c2","dev","Maladie récente selon le bactériologiste Charles Nicolle, Claudius Amyand réussit pour la première fois en 1735 l'opération permettant de sauver un patient; décrite en détail en 1896 sous le nom de typhlite, on peut me détecter lors d'une palpation du point de McBurney; mes symptômes sont des vomissements et une douleur brutale et violente dans la fosse iliaque; afin d'éviter une péritonite, on procédera en urgence à une appendicectomie.","L'appendicite"],["Db48903","dev","Cité antique fondée vers le 9ème siècle avant JC par des grecs, adossée à des collines, face à une baie, je fais partie d'une confédération de cités avec Samos et Ephèse; prise d'assaut par Cyrus le grand en 546 avant Jésus Christ, je suis le point de départ de la colonisation grecque en Méditerranée; en effet, mes habitants ont créé de nouvelles villes comme Avenio (Avignon) et Massilia, devenue Marseille.","Phocee"],["D37ebf5","dev","Chanteur né en 1944, mon dernier album, Za Bakdaz Ŕ The unfinished Opera- est sorti de façon posthume en 2007; ayant suivi mes études musicales à Berlin, je me produis à l'opéra de Berne, puis dans des cabarets New- Yorkais; contre-ténor mais aussi icône du rock au look inclassable, mon succès le plus connu est the Cold song; première star à mourir du sida en 1983, mon vrai nom est Klaus Sperber.","Nomi (klaus)"],["D6d2e51","dev","Vêtement masculin pouvant m'appeler bechmet en Russie; le carrick serait un de mes ancêtres; vêtement de jour, porté notamment lors de cérémonies, je suis une longue veste descendant jusqu'aux genoux; très porté dans les années 1860, je suis revenu à la mode dans les années 1980 grâce au mouvement gothique; mon nom vient de l'anglais « riding coat » signifiant « manteau d'équitation »","La Redingote"],["D8a6052","dev","Acteur et humoriste né en 1966, ayant choisi mon pseudonyme en référence à un héros de série télévisée, je me fais connaître par des sketchs tels que « la poste ». Mêlant parallèlement une carrière dans le cinéma, je suis dirigé par Patrice Leconte dans « Mon meilleur ami », par Fred Cavayé dans « Radin ». Jouant dans mes propres films et évoquant le Nord de la France dans « Bienvenue chez les Ch'tis » et « La Ch'ti Famille ».","Dany Boon"],["D80855e","dev","Forme poétique dont un des premiers recueils publiés en France est paru en 1905 sous le titre de « Au fil de l'eau », j'ai inspiré le recueil « Pour vivre ici » à Paul Eluard. Tirant mon origine d'un type de poème appelé « Tanka », je repose sur une extrême concision formelle. Poème japonais de 17 syllabes, divisé en 3 vers.","Le Haïku"],["D930092","dev","Type de contrat, dont le nom figure dans la définition du verbe « expirer » dans le dictionnaire des idées reçues de Flaubert, je suis passé entre un établissement commercial et un client. Etabli pour une période délimitée pouvant être quelques mois, je suis souscris pour un prix global inférieur à la somme des prix au détail. Convention passée pour recevoir un journal à domicile ou pour emprunter régulièrement un transport.","Un Abonnement"],["Dc6902f","dev","Physicien, né à Kiel en 1858, professeur d'université à Berlin durant près de 40 ans, mon nom a été donné à un prix scientifique. Entreprenant l'étude des conditions d'équilibre thermique du rayonnement électromagnétique, j'émets l'hypothèse selon laquelle les échanges d'énergie s'effectuent de façon discontinue, ce qui constitue la première base de la théorie quantique. Lauréat du Prix Nobel en 1918 et de la médaille Lorentz en 1927, son nom reste associé à une période de l'histoire au cours de laquelle les quatre interactions fondamentales étaient unifiées.","Max Planck"],["D0b49ad","dev","Petit rongeur de couleur sombre de la famille des muridés dont une espèce est dite « à collier ou à gorge jaune », je vis dans les bois et les plaines d'Europe et d'Asie. Mesurant de 15 à 30 cm de haut en comptant ma queue écailleuse, je peux être de l'espèce « Sylvestre » qi se réfugie dans les habitations à l'Automne. Grand rongeur devant mon nom au balatin signifiant « Taupe », je vis plutôt la nuit.","Mulot"],["Debfc1b","dev","Footballeur français né en 1955 à Bamako, j'ai été quintuple champion de France avec les Girondins de Bordeaux puis avec 'Olympique de Marseille. Membre du carré magique de l'équipe de France avec laquelle je remporte l'Euro 84, je deviens entraineur et gagne un titre de Champion de France avec l'As Monaco en 97 avant de rejoindre Fulham, Besiktas, Bordeaux puis le club de Shangaï Shenhua jusqu'en 2012.","Jean Tigana"],["D2d1e09","dev","Citoyen d'une ville de l'antiquité considéré comme adulte après une série de rites initiatiques comme « La cryptie », je devrais ma formation aux législatures Lycurgue et fait l'objet d'une légende égalitaire dès le 3ème siècle avant J-C. M'entrainant à la vie militaire, me consacrant aux affaires de l'Etat, je reçois dès l'âge de 7 ans, une éducation collective très dure basé sur le devoir d'initiatives personnelles. Citoyen de la ville de Spartes.","Spartiate"],["D6ec41c","dev","Pays où se sont développés les royaumes de Kanem ou de Ouaddaï, mon point culminant est l'Emi Koussi. Rallié à la France libre en 1940, j'ai connu dès 1978 un conflit avec la Libye au sujet de la bande d'Aozou. Pays d'Afrique centrale, deux fois plus grande que la France, je suis le pays où a été découvert Toumaï, le plus ancien des préhumains connus. Devant mon nom à mon lac près duquel est située ma capitale N'Djamena.","Tchad"],["D9a6c14","dev","Sport de combat, dont le Championnat d'Europe a eu lieu à Athènes en Avril 2018, je suis l'une des trois variantes d'une discipline crée dans les années trente notamment par des militaires. Pratiqué sur un tapis sous forme de combat de six minutes, je suis désigné par la contraction d'une expression signifiant « Autodéfense sans arme » en russe. Sport né en Union Soviétique mélangeant surtout des techniques de judo et de lutte.","Sambo"],["D0539d4","dev","Partie d'un végétal qualifiée de « tuniquée » pour les cils, je comprends sous ma face inférieure des racines adventices fasciculées et ne fleurit souvent qu'une fois. Renfermant une tige condensée, des feuilles épaisses qui sont plus ou moins reconnaissables et un ou des bourgeons floraux, j'accumule les réserves nutritives nécessaires au végétal. Organe arrondi et généralement souterrain caractéristiques des tulipes.","Bulbe / Oignon"],["D7f5494","dev","Tableau réalisé en 1573 par un italien, je suis le seul de ma série à comporter une signature de mon auteur. Œuvre dans laquelle une courgette, un épi de maïs, des cerises et une pêche forment le visage d'un homme vu de profil; je représente également un vêtement fait d'épis de blé. Tableau de Giuseppe Arcimboldo acquis en 1964 par le Louvre, je constitue l'allégorie d'une saison débutant au mois de Juin.","L'ete"],["D6640df","dev","Compétition sportive dont l'édition 2018 s'est déroulée le 02 Juin, le dernier français à m'emporter est Mickael Barzalona. Disputé sur un parcours de 2400 mètres, je suis l'une des plus prestigieuses courses au monde. Représenté en 1821 sur une toile de Théodore Géricault, je suis réservé aux poulains âgés de 3 ans. Célèbre course hippique anglaise disputée sur un hippodrome au sud de Londres.","Le Derby D'epsom"],["D81889e","dev","Evènement historique, je suis la conséquence de l'adresse des 221 des ordonnances de Saint- Cloud qui ont notamment abouti à la suspension de la liberté de la presse. Débutant par des heurts entre émeutiers et forces de police aux abords du palais royal, je tourne en insurrection avec la prise de l'Hôtel de ville de Paris le lendemain. Ensemble des journées de 1830, immortalisé par la toile « La Liberté guidant le peuple » de Eugène Delacroix.","Les Trois Glorieuses"],["Db8e109","dev","Type de bijou, dont le Louvre conserve une paire créée par Menière et Bapst pour la duchesse d'Angoulême, j'ai été peu porté du 12ème au 17ème siècle. Revenant à la mode sous le Directoire en France avec des robes à la grecque, j'ai été sous la forme dite « serpent » à partir de 1830. Souple ou rigide, je peux être composé de plusieurs rangs de perles, de chaines et attaché par un fermoir. Bijou porté autour du poignet.","Bracelet"],["D1464f1","dev","Ecrivain né en 1930 en Virginie, j'ai travaillé pour le Washington Post et le New York Herald Tribune. Développant une nouvelle forme d'écriture qualifiée de nouveau journalisme de non-fiction, je présente mon premier roman « Le bûcher des vanités ». Cultivant une image de dandy, on me doit « Un homme, un vrai » et « Moi, Charlotte Simmons ». Disparu en Mai 2018.","Tom Wolfe"],["Da42444","dev","Animal auquel l'historien Michel Pastoureau a consacré un ouvrage sous-titré « Histoire d'un cousin mal aimé », j'étais associé au culte d'Osiris dans l'Egypte ancienne. Mammifère domestiqué d'environ 8000 ans avant J-C, je suis pourvu d'une peau ni couvert de poils appelés soie. Omnivore pourvu d'un museau prolongé en groin, élevé dans de grandes exploitations, mon mâle est le vérat, ma femelle est la truie.","Le Porc/le Cochon"],["D364c8a","dev","Match de la Coupe du monde de football ayant opposé deux équipes qui venaient de battre l'Espagne le 02 Juillet et l'Irlande du nord le 04 Juillet précédents, j'ai été arbitré par Charles Corver. Rencontre célèbre pour mes rebondissements au cours de laquelle 6 buts furent inscrits, l'un de mes faits marquants fur le K.O de Patrick Battiston après un choc avec Harald Schumacher. M'étant déroulé à Séville en 1982. Demi-finale de la coupe du monde 1982.","France-rfa"],["Deae61c","dev","Bâtiment installé sur le site de Bennelong Point, inauguré en Octobre 1973 par la reine Elisabeth II. Dessiné par Jørn Utzon, j'ai nécessité 14 années de chantier et plus d'un million de petites tuiles en céramique blanche pour couvrir ma toiture dont la forme évoque un voilier ou un amas de coquillages. Opéra inscrit au patrimoine mondial de l'Unesco en 2007, emblématique de la ville de Sydney.","Opera de Sydney"],["Dbacb4a","dev","Chaîne de montagnes, culminant à environ 1895 mètres d'altitude au Mont Narodnaïa, je m'étends sur plus de 2000 kilomètres de long au sud de la mer de Kara. Occupé du nord au sud par différentes formations végétales allant de la Toundra aux forêts en passant par la Taïga, je suis franchie dans ma partie centrale par le Transsibérien. Chaîne de montagnes de Russie considérée comme la limite conventionnelle entre l'Europe et l'Asie.","L'oural"],["D65e74a","dev","Film américain, sorti le 19 juillet 2017, j'ai réuni plusieurs milliers de figurants. Tourné en 70 mm dans des conditions météorologiques difficiles, je suis qualifié de film expérimental par mon réalisateur. Voyant Tom Hardy jouer le rôle d'un pilote anglais, j'ai été tourné en région Haut-de-France par Christopher Nolan. Racontant l'évacuation en Mai 1940 des troupes alliées connue sous le nom de « Opération Dynamo ».","Dunkerque"],["D9543cb","dev","Mot issu au 3ème siècle d'un nom latin signifiant « vêtu de blanc » en référence aux vêtements portés à Rome dans les circonstances particulières, j'ai pris mon sens actuel en 1546. Employé dans les domaines scolaires et politiques, je suis associé à une idée de titre et de poste par exemple dans le secteur administratif, ou d'examen et de concours pour un étudiant. Désignant notamment une personne qui se présente à une élection.","Candidat"],["D2446b6","dev","Pâtes alimentaires, dont la Chambre de Commerce de Bologne possède une reproduction en or déposée en 1972 par l'académie Italiana Della Cucina, nous sommes confectionnés avec des œufs essentiellement servis avec une sauce à base de viande ou ragoût et avons la forme de longs rubans plats qui ont généralement 8mm de large une fois cuits. Pâtes dont le nom italien vient d'un verbe signifiant « couper ».","Tagliatelles"],["D68cddf","dev","Ile et collectivité d'Outre-Mer française, j'ai été découverte en 1493 par Christophe Colomb qui me donna le nom de son frère. Ile d'une superficie de 25km², en 1784 je suis échangé par Louis XVI à la Suède qui donna à ma ville principale le nom de Gustavia. Ile française des Petites Antilles attachée à la Guadeloupe jusqu'en 2007, mon activité dominante est le tourisme de luxe. Située entre Saint-Martin et Saint Kitts et Nevis.","Saint-barthelemy"],["D103898","dev","Homme politique né en 1945 à Montauban, j'ai également été rédacteur en chef et éditeur d'un magazine ainsi que présentateur d'une émission littéraire à la télévision suisse à partir de 1994. Apatride jusqu'à 18 ans, âge auquel j'adopte la nationalité allemande, je deviens en Mai 68 un des meneurs des manifestations en France. Interdit sur le territoire français jusqu'en 1978. Autrefois surnommé « Dani le rouge ».","Daniel Cohn-bendit"],["D71c430","dev","Site naturel des USA d'environ 3000 km² dont le point culminant est le mont Lyell, je suis traversé par la Merced River et la rivière Tuolumne. Parc créé en 1890 dont seulement 1% de la superficie est ouvert au public, j'abrite des sequoias géants, de nombreux animaux géants comme des lynx, des coyotes ou encore des ours. Parc national situé dans la Sierra Nevada en Californie, célèbre pour mes chutes d'eau.","Parc Yosemite"],["D0a17fb","dev","Ensemble de notes ayant donné mon nom à un groupe vocal créé en 1971 à Bordeaux, je suis dit « ascendant » lorsque je vais du grave à l'aigu et « descendant » dans le cas contraire. Caractéristique de la guitare, notamment pour jouer le thème de jeux interdits, je suis exécuté en égrenant rapidement les notes au lieu de les faire entendre tout à la fois. Accord dont le nom dérive indirectement de celui d'un instrument à cordes.","Arpege"],["Da36e46","dev","Ensemble de musiques classiques ayant inspiré des œuvres telle que celle dite « à l'archiduc », composé par Beethoven en 1811, je pratique la musique de chambre. Notamment représenté par celui portant le nom de Van Baerle, je peux être constitué occasionnellement pour un concert ou pour un enregistrement à l'exemple de ce que font Frank Braley et les frères Capuçon. Ensemble souvent formé d'un piano, d'un violon, d'un violoncelle.","Trio"],["D4be6ca","dev","Couleur désignée par une expression servant de titre en 1949 à un ouvrage de Rolland Dorgelès, je confère au tissu un aspect neutre obtenu en mélangeant des fils clairs et foncés. Ayant donné mon nom à la nouvelle chambre des députés française élus à l'assemblée nationale en Novembre 1919, j'ai été choisi pour confectionner les uniformes de l'armée française lors de la première guerre mondiale. Couleur azur qualifiée par deux mots.","Bleu Horizon"],["D330122","dev","Support généralement de format ID000, désigné par un mot suivi d'un acronyme de trois lettres, je vois mes capacités de stockage augmentées avec le progrès technologique. Renfermant une puce électronique, je permets d'établir la connexion avec le réseau et de sécuriser l'accès à un appareil, notamment grâce au code PIN confidentiel de l'utilisateur. Support inséré dans un téléphone mobile souvent placé près de la batterie.","Carte Sim"],["D9a04c5","dev","Motif décoratif symbolique figuré sur les drapeaux de l'île de Man et de la Sicile, je suis un ancien symbole solaire associé par certains chrétiens à la Sainte Trinité. Fait de trois jambes ou de trois spirales incurvées dans le même sens, rayonnant autour d'un centre parfois entouré d'un cercle, je suis un symbole d'origine celtique. Mon nom est formé du préfixe signifiant trois et du mot « skélos » signifiant jambes.","Le Triskele"],["D71230f","dev","Mot anglais constituant le titre d'une chanson d'Adèle sortie en single en 2015, je suis une interjection courante associée à une comédie musicale adaptée en français par Annie Cordy. Servant en partie à désigner une héroïne d'origine japonaise vivant dans un univers rose, je suis employé par les britanniques au tout début d'une conversation téléphonique. Mot également utilisé par les français pour appeler quelqu'un ou pour le saluer.","Hello"],["Db8361c","dev","Type de spécialistes dont on recense en France 4643 praticiens en exercice au cours de l'année 2018, mon métier est apparu en 1956. Préparant un certificat de capacité en trois ans, travaillant en libéral, je m'occupe du dépistage et de la rééducation oculaire. Intervenant notamment à la demande d'un ophtalmologiste, je corrige par des exercices qui renforcent les muscles des yeux des défauts de la vision comme le strabisme.","Orthoptiste"],["Dcb06fa","dev","Objet dont le nom figure dans le titre d'un tableau de Dominique Amendola exposé à Niort au musée Bernard d'Agesci, je fais partie du matériel de couture. Muni de rebord à chaque bout contrairement à la fusette, plus long que large contrairement à la canette, je suis percé à l'intérieur pour pouvoir être enfilé sur un support de la machine à coudre. Cylindre en plastique ou en bois sur lequel est enroulé un fil.","Bobine"],["Dc5262b","dev","Vertu dont le nom attesté en 1770 est issu d'un mot latin signifiant « relatif à la cité »; selon Pierre Daninos, on nous l'attend toujours un peu de la part de beaucoup qui n'en ont aucun. Me traduisant par le respect des lois de la république, j'implique la connaissance des droits et des devoirs de chacun et des élus de la société. Valeur marquant l'attachement du citoyen au bien commun, différent du patriotisme.","Civisme"],["Dd9a643","dev","Type d'action, désignée par une onomatopée, je suis lié au monde de l'informatique. Comptabilisé pour évaluer l'intérêt suscité par une publicité ou à la fréquentation d'un site, je contribue à la position dans laquelle il figure dont les réponses sont fournies par un moteur de recherche. Dit « simple ou double » ou encore « gauche ou droit »","Clic"],["D3d7190","dev","Cinéaste né en 1937, diplômé du Royal College of Arts de Londres, j'ai d'abord été décorateur puis réalisateur pour la BBC avant de tourner des films publicitaires. Prix du jury en 1977 à Cannes pour mon premier long métrage « Les duellistes », j'ai enchainé des succès avec « Alien le 8ème passager » et « Blade Runner ». Réalisateur et producteur britannique dont le film « Gladiateur » a reçu 5 Oscars.","Ridley Scott"],["D8ae5f4","dev","Cocktail dont le nom est terminé par un suffixe diminutif et formé sur un mot désignant un habitant des zones rurales de mon pays, je dériverais d'un remède traditionnel. Préparé avec un pilon, je suis composé de cachaça, une eau-de-vie issue de la canne à sucre, de quartiers de citron vert, de glaces pilées et agrémenté de sucre et de feuilles de menthe. Cocktail national du Brésil originaire de Sao Polo.","Caïpirinha"],["D3a0f46","dev","Couturier français né à Pot en 1923, j'ai fait des études d'ingénieur avant de devenir dessinateur de mode puis coupeur chez Cristobal Balenciaga. Ouvrant avec ma femme Coqueline ma propre maison de couture en 1961, mes créations structurées futuristes mettent le blanc pur à l'honneur notamment à travers mes petites bottes de chaussettes et mes robes trapèze. Créateur de mode ayant popularisé la minijupe en France.","Andre Courreges"],["D1958cb","dev","Instrument de musique à vent issu du fagotto, j'en trouve une mention dès le 14ème siècle et j'ai été perfectionné 5 siècles plus tard par Johann Adam Heckel. Présentant un corps composé d'un tuyau en bois divisé en deux branches accolées, j'ai une étendue de trois octaves et demi à partir du si bémol graves. Instrument de la famille des hautbois, utilisé pour restituer la voix du grand père dans « Pierre & le loup ».","Basson"],["De77891","dev","Document dont le nom est attesté dès 1150 avec le sens de souhait et de volonté, je constitue une offre commerciale dont la durée est généralement limitée dans le temps. Le plus souvent gratuit, je suis établi avant la réalisation d'une prestation de service chez un particulier par un artisan. Document décrivant de façon détaillée les travaux à exécuter avec une estimation de leur prix.","Devis"],["Db18736","dev","Phénomène de perception désigné par une expression, servant de titre français à un roman policier de Louise Penny en 2016, je suis créé par des flèches dans le dispositif dit de « Müller-Lyer ». Causé par une combinaison de lignes ou d'images, je suis dû à une mauvaise analyse de l'information par le système visuel et le cerveau. Erreur de perception faisant voir des tâches grises aux intersections de la grille d'Hermann.","Illusion D'optique"],["De26f76","dev","Catégorie de personnes à laquelle l'abbé Sieyès consacra une brochure, j'offre une grande diversité parmi mes membres. N'accédant pas aux places d'officiers, je représente 24 à 25 millions de français sous l'Ancien Régime. Convoqué à des Etats généraux, je demande le doublement du nombre de mes députés qui se constituent en assemblée nationale. Comprenant ceux qui n'appartiennent ni au clergé, ni à la noblesse.","Le Tiers Etat"],["D9fea66","dev","Animal hermaphrodite comptant parmi mes nombreuses espèces celle dite « Branchellion torpedinis », je constitue généralement un parasite temporaire de vertébrés. Vivant notamment dans les eaux douces ou salées, je suis terminé par des ventouses à chaque extrémité et produit une substance anticoagulante appelée hirudine. Ver annélide dont certaines espèces se nourrissant de sang sont élevées pour l'utilisation médicale.","La Sangsue"],["Dab80ba","dev","Animateur et journaliste de télé né en 1964, j'ai donné mon nom de famille à un astéroïde en même temps que mes deux collègues, Fréderic Courant et Sabine Quindou. Ayant mené l'essentiel de ma carrière à France 3, je transmets au public ma passion des sciences dans des émissions de vulgarisation comme je le faisais à bord du camion-laboratoire de « C'est pas sorcier ». Animant en 2016 l'émission « Comme une envie de jardin ».","Jamy Gourmaud"],["D7a81ea","dev","Impression ou objet dont l'une orthographiée sous cette forme de 1294 désignait une image ou un apprêt extraordinaire, je suis destinée à procurer une sensation agréable à quelqu'un. Pouvant satisfaire le destinataire si on a respecté ses goûts mais risquant de décevoir, je suis généralement préparée en cachette à l'occasion d'un anniversaire ou d'une fête. Plaisir ou cadeau fait à une personne sans qu'elle s'y attende.","Surprise"],["D4b9002","dev","Chanson italienne, empruntée au folklore piémontais, je suis le titre d'un film français retraçant l'histoire d'immigrés italiens à Marseille avant la guerre. Chant de travail des ouvriers agricoles de rivière, je désigne un hymne des partisans italiens qui ont fait la résistance au fascisme. Enregistré par les motivés d'un groupe musical sur un album de chant de lutte, mon titre signifie « La belle Adieu ».","Bella Ciao"],["D7539bb","dev","Mammifère de l'ordre des pinnipèdes, mon nom vient du grec signifiant « petite oreille ». Protégé par des quotas de chasse, je m'assemble sur les rivages lors de la saison de reproduction. Exploité pour mon huile ou pour ma peau, je suis appelé « Lion de mer » lorsque j'appartiens à une espèce à crinière. Mammifère marin de la famille des otariidés, voisin du phoque.","Otarie"],["D122479","dev","Poète français né en 1842, enseignant je participe à des revues comme « Le parnasse contemporain ». Mais très vite je m'éloigne de la poésie de mon époque avec « Hérodiade » ou « Le cantique de saint Jean ». Ami de Huysmans qui fait de moi un personnage de « A rebours », je disparais alors que vient de paraitre « Un coup de dés jamais n'abolira le hasard ».","Stephane Mallarme"],["Da2be1e","dev","Système de communication pour lequel Charles Tell et Semion Konstantinovitch Tsarapkine signèrent un document dans ma genèse, j'étais testé avec une phrase type en anglais comportant toutes les lettres de l'alphabet. Destiné à empêcher qu'une crise ne se forme en conflit, je fonctionnais à l'origine avec un téléscripteur ne permettant pas les communications orales entre les chefs d'Etat. Liaison établie dès 1963 entre Washington et Moscou.","Le Telephone Rouge"],["Dec1b4f","dev","Roman ayant fait l'objet d'une adaptation musicale en 1963, j'ai la forme d'une chronique racontée par un narrateur dont on apprend l'identité dans les dernières pages du docteur Rieux. Me voulant un témoignage sur l'homme, son courage ou sa lâcheté face à la souffrance, je suis une allégorie de la seconde guerre mondiale où la maladie représente le nazisme et toutes formes d'oppression. Œuvre d'Albert Camus me déroulant à Oran.","La Peste"],["D2c76a1","dev","Partie d'un aliment devant mon nom au mot latin signifiant 'Ce qui enveloppe', je durcis à la cuisson et dépend également de l'opération de refroidissement à la sortie du four appelée Ressuage. Devant être croustillant, je peux présenter un défaut de coloration ou être terne, cloqué, molle selon la façon dont le boulanger m'a travaillé et cuite. Partie extérieure du Pain qui entoure la mie.","La Croute"],["D42d658","dev","Saint, né vers 385 à Cumberland de mon vrai nom Maewyn Succat. Je suis enlevé par des pirates à l'âge de 16 ans et vendu comme esclave. Parvenant à m'échapper, je suis ordonné diacre à Auxerre avant d'être consacré Evêque par Saint Germain. Célèbre pour mon serment dans lequel je monte un trèfle pour illustrer la Sainte Trinité, j'ai évangélisé l'Irlande dont je suis le Saint-Patron et fêté le 17 Mars.","Saint Patrick"],["D8d85a4","dev","Institution romaine, chargée de désigner un Inter-Rex en cas de vacance du pouvoir, j'étais censé avoir un rôle consultatif mais intervenant dans les Finances. Formée de patriciens, de plébéiens qui portaient une tunique à large bande pourpre, je me réunissais à la Curie. Assemblée constituant la plus haute Autorité de Rome sous la République.","Le Senat"],["Da5ec47","dev","Série américaine, créée en 1978 réunissant Gary Coleman, Todd Bridges et Dana Plato, j'ai accueilli Mohammed Ali et Nancy Reagan en invités prestiges. Mettant en scène le personnage de Philippe Dromon, le père de Kimberly et de deux enfants noirs adoptés, je suis une série comique dont les thèmes sont centrés sur l'éducation, l'adolescence et la tolérance. Série dont le titre est constitué par les prénoms des deux jeunes héros.","Arnold et Willy"],["D322d0c","dev","Boxeur n'ayant jamais été mis K.O au cours de mes 106 combats professionnels, j'ai été peu doué à l'esquive et savait encaisser. Ayant infligé à Sugar Ray Robinson sa première défaite en 1943, j'ai également battu Marcel Cerdan dans un des combats du siècle. Champion du Monde américain des Poids Moyens de 1949 à 1951 ayant inspiré le long métrage 'Redding Bull', disparut en Septembre 2017 à l'âge de 95 ans.","Jack Lamotta"],["D09d8c4","dev","Type d'objet jouant un rôle central dans un album de Tintin publié en 1943, je suis désigné par une locution comportant un mot d'origine italienne signifiant « ébauche ». Retrouvé en plusieurs exemplaires dans le tombeau de Toutankhamon, j'étais notamment réalisé au 17ème siècle à la demande des architectes navales pour faciliter la tâche des charpentiers de marine. Modèle réduit d'un navire, reproduit à diverses échelles.","La Maquette"],["D486285","dev","Groupe de Rock Californien, fondé en 1983 à Hollywood, j'ai pour membre fondateur Anthony Kiedis et Michael Balzary, surnommé 'Flea'. Auteur des albums ' Mother's milk', 'Blood Sugar Sex magik'et 'One Hot Minute', j'ai signé des tubes comme 'Give it away', 'Under the bridge', 'Californication'. Groupe Californien dont le nom parfois abrégé par les initiales R.H.C.P évoque un piment rouge.","Red Hot Chili Peppers"],["D8fad48","dev","Siècle au cours duquel Iaroslav le sage Grand Prince de Kiev maria sa fille Anne au roi de France, j'assiste à la fin du Califat Omeyade de Cordoue. Voyant l'empereur germanique Henri 4 s'humilier devant le pape à Canossa au début de la Querelle des Investitures, je corresponds à l'époque où Godefroy de Bouillon s'illustra à Jérusalem. Siècle au cours duquel est monté sur le trône de France le roi Henri 1er.","11eme Siecle"],["D19e66d","dev","Acte officiel ayant fait l'objet en 2000 d'un traité juridique en France désigné sous le sigle PLP, je suis valable dans toute la France lorsque j'ai été déposé à l'INPI concernant les innovations techniques. Susceptible d'avoir une application industrielle, je procure un monopole d'exploitation pour une durée maximale de 20 ans. Titre de propriété d'une invention délivré à la personne ou la société.","Le Brevet"],["Da4d1ff","dev","Bras de mer d'environ 15km dans ma partie la plus étroite et 60km de long, je suis aujourd'hui associé à un projet de tunnel ferroviaire. Ayant un climat changeant dû à la rencontre des zones froides et chaudes, j'abrite les Lots du Persil. Limité à l'Ouest par le Cap Spartel, bordé par le port d'Algésiras, je suis un bras de mer séparant le Maroc de l'Espagne.","Detroit de Gibraltar"],["D7f77d5","dev","Arbre fruitier à croissance rapide pouvant être des variétés « verna » ou « Eureka », je suis caractérisé par de grandes feuilles luisantes parfumées. Très décoratif car je porte en même temps des fleurs blanches odorantes ou des fruits verts ou mûrs, je donne des agrumes de forme ovale à pulpe juteuse et acide qui deviennent jaunes à maturité. Arbre cultivé sur le littoral méditerranéen, je produis des citrons.","Le Citronnier"],["D84888b","dev","Type de revenus, imposé au maximum en France à 33,33% pour une entreprise, je peux dans ce cas en partie conserver ou accroître la capacité de production. Récompense du risque pris par l'entreprise pour certains économistes comme Adam Smith ou « « Revenu d'exploitation de l'homme par l'homme » pour d'autres comme Karl Marx, je corresponds à l'excédent des recettes sur les frais.","Le Profit / le Benefice"],["D06c77d","dev","Activité sportive dont le nom déposé a inspiré en 2014 à Leslie Bedos un ouvrage confectionné en plastique, je suis souvent pratiqué en cours collectif avec ou sans musique. Sollicitant tous les muscles du corps et limitant les risques de blessure malgré la pression exercée par l'eau, je combine différents exercices pour lesquels on utilise des haltères en mousse et des frites. Forme de gymnastique réalisée en piscine.","L'aquagym"],["Dce6c7b","dev","Ensemble d'éléments propres à certaines plantes, je peux être dit « épigyne » dans le cas de la carotte pour qualifier mon point d'insertion. Présentant une grande diversité du nombre de formes et de couleurs parfois au sein d'une même fleur, je suis un organe dont l'ensemble constitue l'androcée. Comprenant une partie mince ou le filet, et une partie mince ou l'anthère qui renferme le pollen, je suis l'organe mâle des plantes à fleur opposé au pistil.","Etamine"],["D8952ca","dev","Taxe supprimée à paris par la loi du 02 Juillet 1943 avant d'être abandonnée dans le reste de l'Hexagone en 1948, j'étais décriée car je ne tenais pas en compte les revenus des personnes. Permettant de subvenir aux dépenses communales, je m'appliquais à certaines marchandises de consommation courante telles que les boissons et les comestibles. Taxe autrefois perçue dans les bureaux spécifiques à l'entrée de certaines villes.","L'octroi"],["Dacb4df","dev","Héroïne dans la mythologie grecque, j'ai inspiré les trois grands poètes grecs ainsi que Hofmannsthal, O'Neill et Giraudoux. Incarnation de la piété filiale, je me venge du meurtre de mon père Agamemnon par ma mère Clytemnestre et son amant Egis. Condamnée à mort par le tribunal de l'aéropage mais sauvée par Apollon, mon nom vient probablement du grec « Elector » qui signifie 'brillant'. Sœur d'Iphigénie et d'Oreste.","Electre"],["D48c19d","dev","Substance avec laquelle on traitait un malade pour la première fois le 12 Février 1941 en Angleterre, je suis à la base des médicaments de la famille des 'bêta-lactamines', actifs contre certaines bactéries. Utilisée dans des infections à germe sensible telles que la pneumonie malgré des phénomènes de résistance, je suis traditionnellement fabriquée à partir d'un type de moisissure. Antibiotique découvert en 1928 par Alexander Fleming.","La Penicilline"],["De2966b","dev","Adjectif dont une des deux formes est attestée en 1854 pour qualifier un fil servant à couper le marbre inventé par Eugène Chevalier, je m'applique à certaines tondeuses à gazon. Pouvant être associé en science pour mon mouvement de rotation et de translation d'un objet autour d'un axe, je peux être synonyme de 'en colimaçon' pour un escalier aux marches dites 'rayonnantes'. Adjectif signifiant 'en forme d'hélice'.","Helicoïdal"],["De5caee","dev","Tableau peint en 1573 au premier plan duquel mon auteur, un peintre italien représente un citron et une orange, je fais partie d'une série commandée par Maximilien II de Habsbourg. Représentant un vieillard dont le profil est constitué d'une suite d'arbres avec à la bouche un champignon, je suis dominé par des teints sombres. Toile allégorique de Giuseppe Arcimboldo évoquant la Saison la plus froide en France.","L'hiver"],["D3a0434","dev","Tragédie, représentée pour la première fois le 17 Novembre 1660 dans l'appartement de la reine, je connus tout de suite un grand succès. Mettant en scène quatre personnages principaux, je montre les conséquences désastreuses de l'amour passion. Pièce de Racine et dans laquelle l'héroïne captive de Pyrrhus et veuve d'Hector pourra sauver son fils Astyanax d'une mort certaine qu'en épousant son vainqueur qu'elle n'aime pas.","Andromaque"],["Dbb6d99","dev","Objet qui d'après Victor Hugo est un engrenage, je peux être tendu de vignette appelé 'cul-de-lampe' et suis associé à des termes comme routière ou bandeau. Dit 'saveté' lorsque je suis mal fait, réparé ou relié, pouvant être de différents formats et concerné par tous les sujets, je suis identifiable à un code à 13 chiffres appelé ISBN. Objet fait d'un assemblage de feuilles imprimées et réunies en un volume.","Le Livre"],["D457d9e","dev","Mer appelée 'Lac Asphaltite' dans l'antiquité, je perds environ 300 millions de m3/an en raison de l'évaporation et mon exploitation pour l'irrigation. Située dans une cuvette à plus de 420 mètres en dessous au niveau de la mer, je dois mon nom au fait que les poissons ne peuvent pas y vivre.","Mer Morte"],["D32be12","dev","Album de Tintin, publié en 1963, et que Michel Serres a analysé en 1970 dans un article, je ne mets pas en scène des personnages de méchants. Marqué par une irruption des médias, je m'ouvre par une chute du Capitaine Haddock dans un escalier entièrement cimenté, je dénonce des préjugés à l'égard des tsiganes. Album de Tintin évoquant le vol du Nemrod.","Les Bijoux de la Castafiore"],["D3621a3","dev","Acte transgressif dont le nom a servi de titre à un récit d'Ismail Kadaré écrit en 1962 et publié dix ans plus tard, je suis souvent associé au mouvement d'avant-garde. Destiné à déranger le public dans un but expérimental ou créer un scandale générateur de succès, je suis un acte perturbateur par lequel on cherche à susciter une réaction violente.","La Provocation"],["D55874f","dev","Ile appelée 'Borikén' par les amérindiens, je suis la plus orientale des Grandes Antilles. Très peuplée à l'arrivée de Christophe Colomb, j'ai été une colonie espagnole jusqu'en 1898, date à laquelle je fus cédée aux USA. Obtenant en 1952, un statut qui confère à mes habitants, les mêmes droits que les citoyens américains, sauf celui d'élire les présidents, je suis désigné par un nom qui signifie ' Port Riche' en Espagnol.","Porto Rico"],["Dd45bf6","dev","Discipline dans laquelle lors du départ d'une course, le règlement stipule qu'il est interdit d'accrocher les orteils au bord du trop-plein, je suis pratiqué en premier lors des relais. Ayant eu comme championne Sybil Bauer, mon exécutant se repère par rapport à la ligne des 5 mètres de la piscine pour effectuer son virage. Seule discipline dans laquelle les concurrents s'alignent face au départ.","Le Dos ou le Dos Crawle"],["D9ec380","dev","Comédien français, récompensé par le César du meilleur acteur en 1976 et 1990, j'ai débuté au théâtre national populaire Jean Vilar où je rencontre ma future épouse, Monique Chaumette. Alternant les rôles d'hommes ordinaires et parfois des personnages dérangeants comme 'Un Grand de Bouf', 'Coup de Torchon', j'ai joué dans la trilogie des ripous. Révélé dans 'Alexandre le Bienheureux'.","Philippe Noiret"],["D231e30","dev","Compétition, dont la dernière édition s'est déroulée du 12 au 19 Novembre 2017 à Londres, j'ai été organisée pour la première fois à Tokyo en 1970 où je fus remporté par Stan Smith. Marquée en 2017 par le forfait de Rafael Nadal et de son remplacement par Pablo Carreño Busta, Ivan Lendl fut le premier à me gagner à 5 reprises.","Les Masters"],["D6ff680","dev","Organisme vivant, dont le nom est issu du grec signifiant 'bâton', je peux être garni de cils ou de flagelles me permettant de me déplacer. Mesurant entre 0,1 et 50 micromètres, je suis généralement unicellulaire et me reproduit par scission. Pouvant me regrouper en chaines comme les streptocoques ou en grappes comme les staphylocoques, je regroupe également les actinomycètes et le colibacille. Organisme combattu par les antibiotiques.","Bacterie"],["D7dae5b","dev","Mot qui désignait au Moyen-Age, un jeune homme aspirant à devenir un chevalier et par extension à un jeune homme noble, j'ai acquis mon sens actuel en 1808. Désignant aussi au 14ème siècle celui qui avait obtenu dans une faculté le premier des trois grades universitaires, je tire mon nom du latin populaire 'baccalaris'. Terme m'appliquant aux personnes ayant passé avec succès l'examen de fin d'études secondaires.","Bachelier"],["D542fc3","dev","Arbre de la famille des Hamamélidacées, introduit en Angleterre en 1680, je suis également appelé 'Copalme d'Amérique'. Ayant des rameaux rougeâtres et des fruits bruns en boules hérissées, je donne de grandes feuilles proches de celles de l'érable qui se colorent en rouge ou en pourpre à l'automne. Arbre devant mon nom courant au latin scientifique signifiant Ambre et Liquide.","Liquidambar"],["D049110","dev","Classe d'animaux contenant la limnée, la planorbe ou encore le buccin, je suis divisée en 3 sous-classes: les Prosobranches, les Opisthobranches et les pulmonés. Plus important groupe de mollusques dont le groupe d'espèces dépasserait 100.000, je suis aussi le seul qui occupe le milieu marin, les eaux douces et le milieu terrestre. Type d'animal rampant sur un large pied ventral doté d'une coquille comme l'escargot ou pas comme la limace.","Gasteropodes"],["D1c24c5","dev","Sportif qui reçut le trophée UNFP du footballeur de l'année en 2002 et 2003, j'ai été champion d'Espagne en 2000 avec la Corogne. Joueur complet réputé pour mon efficacité devant la cage adverse, j'ai inscrit 47 buts en 88 matchs avec le Portugal, ce qui fait de moi, le deuxième meilleur buteur derrière Cristiano Ronaldo et devant Eusébio. Ancien attaquant surnommé 'L'aigle des Açores', ayant joué au PSG.","Miguel Pauleta"],["D5a9942","dev","Pièce de théâtre, publiée en 1947, je vaux l'année suivante le Prix Pulitzer à son auteur. Sur fond de lutte entre morale puritaine et désir charnel, je me déroule à Nouvelle-Orléans, et dresse le portrait de Blanche DuBois qui glisse peu à peu de la mythomanie vers la folie. Pièce de Tennessee William, mise en scène puis adaptée au cinéma par Elia Kazan avec notamment Marlon Branlo.","Un Tramway Nomme Desir"],["D921301","dev","Type de territoire dont le nom courant attesté dès 1312 a été formé sur un verbe d'origine latine, j'ai vu mon nombre diminué grâce à des échanges. Posant des problèmes de droit quant au transit des personnes, j'ai pour exemple le village espagnol de Livia en France et la République de Saint-Marin en Italie. Territoire d'un Etat entièrement entouré par le Territoire d'un autre Etat.","L'enclave"],["D57966d","dev","Roi de France représenté vers 1450 par un portrait de Fouquet, je suis né à Paris en 1403. Ayant dû fuir la capitale et me réfugier à Bourges durant la guerre civile, et pris confiance en moi grâce à Jeanne d'Arc qui me fit sacrer à Reims, j'ai réorganisé mon royaume et aidé notamment par Jacques Cœur. Fils de Charles VI.","Charles Vii"],["D4fb56f","dev","Partie d'un corps céleste, ayant fait l'objet de découverte de Huygens en 1656 et de Maxwell en 1857. Je suis constitué de blocs de glace et suis déformé par les satellites proches. Faisant à certains endroits une dizaine de mètres d'épaisseur pour plus de 300.000 km de diamètre, je suis partiellement visible de la Terre au moyen d'un télescope. Ensemble de cercles entourant une planète portant le nom d'un dieu romain.","Les Anneaux de Saturne"],["Ddd5e83","dev","Prénom féminin, d'origine germanique, notamment formé sur un élément qui signifie 'beau' ou 'cavalier', je suis associé à la Scandinavie en raison d'une sainte suédoise, fêtée le 2 Septembre. Porté par la skieuse appelée Jacquemod, je fus surtout à la mode au cours des années 1970, période à laquelle je fus donné à l'actrice nommée Chauvin. Prénom féminin popularisé en France par l'actrice suédoise du nom de Bergman.","Ingrid"],["D4153c5","dev","Procédé que François Arago présenta officiellement à l'Académie des Sciences le 7 Janvier 1839, j'utilisais des plaques de cuivre argenté soumises à des vapeurs d'iode. Connaissant un réel engouement auprès du public malgré un long temps de pause, j'ai servi à réaliser des portraits de personnalités de l'époque dont j'ai donné une image génique. Premier procédé photographique commercialisé devant mon nom à Jacques Daguerre.","Daguerreotype"],["D2835f9","dev","Qualité d'une personne dont le nom vient d'un mot latin signifiant notamment « impétuosité », je fais référence à un cours d'eau, je peux être physique ou mentale. Permettant à une personne d'agir avec promptitude ou d'aller vite dans une situation donnée, je suis différente de la hâte qui manifeste un empressement extrême. Qualité utile aux candidats de Questions pour un Champion notamment dans la phase des 9 points gagnants.","La Rapidite"],["D4e3ffc","dev","Humoriste, né le 7 juillet 1977. Je joue dans divers café-théâtre et cabarets parisiens et présente en 2000 mes premiers spectacles « Alléluia » et « Envers contre tous » avant d'être repéré par Jamel Debbouze. Acteur et réalisateur du film « Coexister » sorti en 2018, j'ai co-écrit « Case départ » et « Le crocodile du Botswanga » avec mon compère Thomas Ngijol. En tournée avec mon spectacle « Plus rien à perdre » en 2018.","Fabrice Eboue"],["Dcc5b02","dev","Plante bisannuelle comestible de la famille des ombellifères dont le nom scientifique est Apium graveolens, j'ai été cultivé dès l'antiquité en Egypte et en Chine. Mesurant au moins 50 cm de haut portant des feuilles brillantes récoltées en Eté et en Automne, je possède des vertus diurétiques. Plante aux branches brillantes striées dont la variété rave fournit un sel utilisé pour les condiments.","Le Celeri-rave"],["D95e43c","dev","Notion dont relève sur le plan grammatical les mots « apercevoir » ou « gaîment », mon nom est attesté dès 1243 dans le vocabulaire du droit. Terme pouvant être associé à l'adjectif « culturel » je désigne alors une doctrine visant à retirer des négociations de l'Organisation Mondiale du Commerce, les biens et les services relevant de la culture. Caractéristique de la grammaire qui selon l'adage confirme la règle.","L'exception"],["Dd2a305","dev","Instrument de musique pour lequel Elliot Carter écrivit huit pièces entre 1950 et 1966, je suis souvent au nombre de deux paires dans l'orchestre symphonique. Reposant sur un trépied, accordé par un système de pédales, je suis constitué d'un fût en cuivre ou en fibre de verre. Recouvert d'une membrane de peau animale ou plastique, sur lequel on frappe avec une paire de mailloches. Instrument à percussion.","Les Timbales"],["Dc3920e","dev","Sport dont la fédération française a pour origine une réunion constitutive tenue le 03 Janvier 1921, je comprends diverses spécialités telles que le Pasaka. Pratiqué dans les installations couvertes ou au moyen d'un fronton situé en extérieur, je consiste à envoyer directement ou après un rebond une balle contre un mur principal à main nue ou avec une paleta ou un chistera. Sport associé au sud- ouest de la France.","La Pelote Basque"],["De5f484","dev","Plante du genre gossypium originaire de l'Inde pouvant atteindre une dizaine de mètres à l'état sauvage, ma culture nécessite un climat tropical d'une importante irrigation. Fournissant une fibre textile dont la première filature apparaît en Angleterre en 1641, j'ai pour principaux producteurs mondiaux les USA, la Chine, l'Inde ou le Mali. Cultivé pour mes fleurs qui produisent des boules blanches et soyeuses.","Le Cotonnier"],["Db8d1fb","dev","Produit d'hygiène pour lequel William Shepard a obtenu un brevet d'invention en 1865, j'étais alors fabriqué en dissolvant un produit solide dans de l'eau et en y ajoutant de l'ammoniac. D'abord commercialisé dans des distributeurs publics avant d'être proposé aux particuliers, je suis placé dans un flacon en plastique équipé d'une pompe qui libère juste la quantité voulue. Produit d'hygiène destiné à se laver les mains.","Le Savon Liquide"],["Da23a4b","dev","Compositeur français né en 1862, j'entre à dix ans au Conservatoire avant d'obtenir le Prix de Rome en 1884 pour ma cantate « L'enfant prodigue ». Cherchant à libérer ma musique des règles académiques je m'inspire d'un séjour au bord de la Manche pour composer la symphonie intitulée « La mer ». Compositeur mort en 1918, auteur de l'opéra « Pelléas et Mélisande » et de l'œuvre « Prélude à l'après- midi d'un faune ».","Claude Debussy"],["D214bcd","dev","Film d'animation ayant nécessité 60.000 journées de travail, mon scénario a été co-écrit par mon réalisateur et Céline Garcia. Faisant appel notamment aux voix de David Bowie et Snoop Dog dans ma version originale, en français ma version originale, en français mes personnages sont doublés par Mylène Farmer et le rappeur Rohff. Film de Luc Besson sorti en 2006, je raconte l'histoire d'un petit garçon pénétrant dans un monde de lutin.","Arthur et les Minimoys"],["D9560d6","dev","Ouvrier autrefois appelé mortellier ou limousin, j'utilisais le bouloir, la boucharde. Ayant vu mes méthodes de travail évoluées avec les matériaux modernes, je requiers le sens de l'équilibre, l'esprit d'équipe, le respect des règles de sécurité. Ouvrier ou artisan travaillant le ciment et le béton ainsi que la brique et la pierre, je construis les fondations d'un immeuble, monte ses éléments porteurs.","Le Maçon"],["D4b6d83","dev","Mammifère d'Afrique ayant pour nom scientifique Syncerus caffer, je mesure de 100 à 170 cm au garrot pour un poids de 300 à 900 kg. Doté pour les individus des deux sexes de cornes massives moins développées chez les femelles que chez les grands mâles, j'ai une allure de bœuf domestique. Grand herbivore à la robe allant du rouge au brun-foncé vivant en troupeau.","Le Buffle"],["Dada768","dev","Nouvelle publiée en 1943, un an après la mort de mon auteur, j'ai été adapté pour le théâtre par Éric-Emmanuel Schmitt. Me déroulant principalement durant une traversée en mer, j'ai pour thème la folie, la solitude, la manipulation. Œuvre de Stefan Zweig dans laquelle un ancien avocat raconte comment il dût sa survie à la pratique d'un jeu de stratégie alors qu'il avait été arrêté et mis à l'isolement par les nazis.","Le Joueur D'echecs"],["D243933","dev","Instrument dont le nom est associé au mot « pas » dans la suite numéro 2 de « Namouna » d'Edouard Lalo, j'émets des sons assez forts considérés comme indéterminés. Frappé avec une baguette en bois quand je suis posé sur un pied, je peux être aussi constitué de deux plateaux circulaires en métal maintenu dans chaque main grâce à des lanières et frappés l'un contre l'autre. Instrument à percussion devant mon nom au mot grec « Kumbalon »","Les Cymbales / la Cymbale"],["Dc89523","dev","Roman paru aux USA en 1906, publié en France en 1923. J'ai fait l'objet d'un film d'animation sorti en Mars 2018. Devenu un classique de la littérature du 20ème siècle, j'évoque les rapports entre l'homme et la nature sauvage. Racontant la vie d'un animal né dans le grand nord avec ses différents maîtres, je suis un roman de Jack London publié après « L'appel de la forêt » dont le héros est mi-loup mi-chien.","Croc-blanc"],["D3a475e","dev","Pierre entourant sous forme de deux couronnes la base du trophée original de la Coupe du monde de la FIFA, je suis souvent associée à de l'azurite. Carbonate de cuivre hydraté formant des masses mamelonnées à l'éclat vitreux, je révèle une fois polie des zones concentriques ayant différents tons de verre. Pierre dont on a trouvé en Russie dans l'Oural de gros blocs utilisés pour orner l'une des salles du musée de l'Hermitage.","La Malachite"],["D319d8a","dev","Film américain sorti en 1996. Je me déroule à Prague au siège de la CIA et dans le tunnel sous la manche. Histoire d'espionnage de Brian de Palma, j'ai pour objectif une opération à l'ambassade des Etats-Unis qui est d'appréhender un espion en possession d'une disquette contenant une liste secrète d'agents. Offrant une scène spectaculaire sur un TGV avec Jean Reno, John Voight, Emmanuelle Beart et Tom Cruise entre autres. Film adapté d'une célèbre série américaine.","Mission Impossible"],["D389ce8","dev","Récipient dont le premier modèle commercialisé en 1904 avait pour origine une invention écossaise utilisée pour des expériences scientifiques, je comprends généralement un gobelet. Caractérisé par deux parois de verre ou d'inox séparés par du vide, je permets de conserver quelques temps le liquide contenu à sa température initiale froide ou chaude. Récipient souvent désigné par un nom déposé signifiant « chaud » en grec.","Thermos"],["D050390","dev","Souverain dont le véritable nom est « Khnum- khuf » abrégé en Khoufou, j'appartiens à la 4ème dynastie fondée par mon père Snéfrou. Ayant vécu vers 2600 ou 2500 avant notre ère en Egypte, j'ai eu à cause de certaines légendes tardives la réputation d'être tyrannique tout comme mon fils Khephren. Pharaon ayant fait construire la grande pyramide de Gizeh à laquelle on associe le nom grec sous lequel je suis connu.","Kheops"],["D0e2e30","dev","Etat psychologique désigné en allemand par le terme « versagung », je suis considéré comme un moteur de la cure psychanalytique. Pouvant résulter d'un manque de confiance ou d'une peur des interactions, je suis un sentiment désagréable, susceptible d'amener à la dépression et à des comportements déviants. Entendu au sens large comme l'état d'un sujet qui se trouve dans l'incapacité d'obtenir l'objet de satisfaction qu'il convoite.","La Frustration"],["D803b00","dev","Partie d'un végétal associée à l'adjectif « caulinaire », je peux avoir une apparence particulière comme une section carrée dans le cas de la bétoine. De couleur verte, la plupart du temps, dans mes parties jeunes, je conduis la sève, suis renflée à l'endroit où se trouvent les nœuds et donne souvent naissance à des ramifications. Axe généralement aérien dressé d'une plante sur lequel sont insérées les feuilles.","La Tige"],["D980df0","dev","Attitude ayant donnée son nom au titre français du troisième tome de la saga « Twilight » de Stephenie Meyer, je peux ne durer qu'un instant. Opposée à l'assurance et proche de l'incertitude, je traduis le doute ressenti par une personne et peut être interprétée comme un manque de décision. Attitude de quelqu'un d'irrésolu qui n'arrive pas à prendre une décision.","L'hesitation"],["D13cd5b","dev","Mammifère mâle dont le nom est issu du néerlandais, je compte une soixantaine de races en France dont la Bizet et la Belle-Île. Animal sacrificiel dans la Bible, je peux porter des cornes annelées et spiralées pesant jusqu'à 25 kg chacune et figurant dans un mythe dont Jason est le héros. Ruminant de la sous-famille des caprinés.","Le Belier"],["D4e7477","dev","Sportif américain d'origine italienne, j'intègre à l'âge de 18 ans en 1933 l'équipe des San Francisco Seals. Trois ans plus tard je rejoins la Major League de baseball avec les New York Yankees, club avec lequel je remporte neuf titres de champion des Etats-Unis. Sacré meilleur joueur de tous les temps en 1969, je suis mentionné dans la chanson « Mrs Robinson » de Paul Simon et Art Garfunkel. Disparu en Mars 1999.","Dimaggio"],["D8f32f0","dev","Type de personnes, désigné par le nom d'une mascotte créée par Fabrice Pialot en 1996, je suis devenu un stéréotype dont ma définition est variable. Mal vu par les passionnés de sport, je me prends pour un expert lorsque je donne mon avis, mon enthousiasme pour certains grands matchs en fonction des résultats des équipes. Supporter de football appelé par le nom du coq servant de mascotte lors de la Coupe du Monde de 1998.","Footix"],["D8d0e9e","dev","Ingénieur né en 1841 à Muret, j'ai fait preuve d'une grande inventivité en créant le théâtrophone, un système permettant d'entendre une représentation grâce à un appareil récepteur. Me consacrant à la construction de plusieurs engins plus lourds que l'air, je n'ai pu faire reconnaître en l'absence d'officiels assermentés de la première expérience de vol à bord de l'Eole en 1890. Ingénieur auquel on doit le mot « avion ».","Clement Ader"],["D279d7a","dev","Groupe de rock britannique. De 1977 à 1982, nous avions enregistré cinq albums réunis en 2013 dans un coffret anthologique. Groupe dont le nom signifie à la fois « coup de cymbale » et « affrontement », notre premier album rageur engagé a été suivi de « London Calling ». Groupe fondé par Paul Simonon, Joe Strummer le fameux auteur des chansons « Rock the Casbah » et « Should I Stay or Should I Go » ainsi que « The Magnificient Seven »","The Clash"],["Daf7f30","dev","Roi légendaire devant m'exiler après avoir tué Phocos puis Eurytion, j'erre longtemps à travers la Grèce et suis accueilli par Acaste. Fils d'Eaque, je me marie après la mort de ma première épouse Antigone avec la néréide Thétis en présence de tous les dieux sauf Eris qui lance la pomme de discorde dans l'assistance. Réussissant à sauver mon fils Achille des flammes dans lesquelles sa mère pensait le rendre immortel.","Pelee"],["D860b08","dev","Adjectif figurant dans le titre d'un ouvrage du poète Patrice de La Tour du pin publié en 1959, j'exprime généralement tune idée de hiérarchie dans une classification. Associé à un empire français ayant duré presque dix-huit ans, je qualifie l'une des classes dans les transports ferroviaires. Adjectif numéral désignant le deuxième rang dans un ensemble à deux entités ou plus.","Second"],["Dc22df3","dev","Sportive née en 1968 entraînée notamment par Fernand Urtebise, Jacques Piasenta et John Smith, j'ai été élue champion des champions français par « L'équipe » à deux reprises. Championne du monde de sprint sur l'une de mes distances de prédilection en 1991 et 1995, je suis la première athlète, hommes et femmes confondus à avoir remporté le 400 mètres lors des deux jeux olympiques successifs. Surnommée « La gazelle » ou encore « La divine ».","Marie-jose Perec"],["Daa6ec7","dev","Traumatisme désigné par une locution imagée, je suis appelé « Whiplash » chez les anglo- saxons. Type de lésion observée pendant la seconde guerre mondiale chez les pilotes américains lors des catapultages sur les porte- avions, je suis prévenu par l'adoption des appui-têtes et des ceintures. Dû à un choc ou à un coup porté, aussi appelé traumatisme cervical.","Le Coup du Lapin"],["D2d59d3","dev","Type d'activité artisanale ou industrielle dès le nom est attesté dès 1636, je me suis développé en Europe pendant la Renaissance à Cordoue et à Venise. Ayant pris mon essor en France au XVIIème siècle à Paris, Lyon ou Rouen, j'emploie des outils tels que la laine, le couteau à parer et la refendeuse. Consistant à travailler le cuir pour en faire des portefeuilles, des ceintures et des sacs, mon nom évoque un pays du Maghreb.","La Maroquinerie."],["De76005","dev","Objet qui fut propulsé victorieusement à 801 reprises par Goldie Ash durant sa carrière professionnelle, ma production a donné lieu à un différend commercial lors des Jeux de Sotchi. Mesurant 7,62 cm de diamètre, pesant entre 156 et 170 grammes, je suis un objet en caoutchouc vulcanisé et le plus souvent noir appelé « puk » en Suisse.","Le Palet"],["Db9bca5","dev","Personnage historique ayant eu pour devise « Palmam qui meruit ferat » qui veut dire « Celui qui a mérité la palme la porte », je meurs en dû murmurant « Dieu merci j'ai fait mon devoir ». Capitaine de vaisseau en 1779 ayant perdu un œil à al bataille de Calvi en 1794 après avoir porté secours à Paoli, je détruis la Flotte française quatre ans plus tard à Aboukir afin de couper la retraite à l'Armée de Bonaparte. Amiral anglais victorieux mais mortellement blessé à Trafalgar.","Horatio Nelson"],["Db01cc5","dev","Oiseau dont l'espèce dite « variable » assez courante en France comprend la sous-espèce « arrigonii », je suis un rapace. Observable en journée en Auvergne dans l'Est de la France, je repère les rongeurs perchés sur un piquet de clôture et a l'habitude de voler en cercle en poussant une sorte de miaulement. Rapace du genre « buteo ».","La Buse"],["D46b504","dev","Fleuve long de 70 km qui en amont de mon cours est appelé « Baztan », je traverse les communes de Biriatou et d'Urrugne. Prenant ma source à Erratzu en Navarre espagnole, j'abrite l'île des Faisans sur laquelle fut signé le Traité des Pyrénées en 1635. Fleuve côtier servant de frontière entre la France et l'Espagne sur quelques kilomètres, je me jette dans le golfe du Gascogne.","Bidassoa"],["D5efc1c","dev","Epreuve ayant permis à la française Mélanie de Jesus dos Santos de devenir championne d'Europe lors des Championnats d'E
