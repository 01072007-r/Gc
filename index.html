urope de gymnastique artistique féminine en 2018. Exercice commun aux hommes et aux femmes d'une durée d'une minute environ, je mêle passage chorégraphique, pirouette, équilibre, diagonale acrobatique. Agrès de gymnastique pratiqué en musique pour les femmes sur un praticable carré doté d'un plancher à ressort.","Le Sol"],["D754759","dev","Femme de lettres, née en 1885. Je fais mes débuts sous le pseudonyme d'Isak Dinesen avec \"Sept contes gothiques\" e 1934 suivi des \"Contes d'hiver\" en 1942. Mariée à mon cousin, je pars m'installer au Kenya où je demeure jusqu'en 1931. Femme de lettres danoises ayant évoqué mon expérience sur ce continent dans l'autobiographie \"La Ferme africaine\" dont est tiré le film Out of Africa: Souvenirs d'Afrique \".","Karen Blixen"],["D0d41c9","dev","Organe de certaines plantes, j'ai beaucoup intrigué Darwin qui m'a qualifié \"d'abominable mystère\". Produit par des plantes apparues il y a 150 millions d'années qui dominent aujourd'hui le monde végétal à plus de 90%, je suis caractéristique des phanérogames. Fournissant à l'humanité des aliments tels que les fruits et les légumes, je suis un organe coloré constitué d'étamines, d'un pistil et de pétales.","La Fleur"],["D8a89b2","dev","Organe du corps humain pouvant être le siège d'un rétrécissement pathologique nommé \"Anneau de Schatzki et Gary\", je suis constitué de muqueuses et de muscles lisses animés par des mouvements péristaltiques. D'un diamètre de deux centimètres et demi et long de 25 centimètres, je peux être sujet à des brûlures dues à des remontées de sucs gastriques. Conduit musculo-membraneux du tube digestif permettant le passage des aliments du pharynx vers l'estomac.","Œsophage"],["D57daad","dev","Oiseau répandu en Europe dont le nom savant est \"Sturnus vulgaris\", je peux être confondu avec le merle noir dont on me distingue par un plumage moucheté de blanc au reflet irisé. Migrateur partiel, je me rassemble en Hiver en nuée comptant des milliers d'individus. Également appelé \"Sansonnet\", on me reconnait à mon chant aux timbres variés mêlant sifflet et gazouillis qui est capable d'imiter d'autres espèces d'oiseaux.","Étourneau"],["D4cb97d","dev","Tube sorti en 1976 aux USA, je commence par une longue intro à la guitare qui précède la phrase \"On a dark desert highway\". D'une durée de 6minutes 31 célèbre pour le duo de guitares de Don Felder et Joe Walsh, je comprends dans mon refrain les paroles \"Such a lovely place Such a lovely face\". Grand succ- s du groupe \"Eagles\" qui fut dansé en slow dans la deuxième partie des années 70.","Hotel California"],["D6ff57d","dev","Verbe du premier groupe désignant une action considérée par Balzac comme \"La gastronomie de l'œil\", je suis issu de l'ancien scandinave signifiant \" courir çà et là\". Évoquant une idée proche de \"musarder\" ou de se balader, je suis associé à la sensation de liberté que l'on a en avançant sans direction précise et en s'arrêtant pour regarder autour de soi. Verbe désignant le fait de se promener au hasard et sans hâte.","Flaner"],["Db0326b","dev","Trouble qui selon une étude australienne affectera une personne sur deux d'ici 2050, je concerne environ 40% des français en 2017. Pathologie en augmentation chez les jeunes, je pourrais être évité selon les spécialistes en réduisant le temps passé devant les écrans au profit de la lumière naturelle riche en ultraviolet. Trouble de la vue entraînant une difficulté à voir au loin sans affecter la vision de près.","La Myopie, la Brachymetropie, L'hypometropie"],["D07a6c0","dev","Recueil de nouvelles publié à Paris en 1943, je comprends 10 nouvelles dont celles intitulées \"Le Décret\", \"Légende poldève\" et \"L'Huissier\". Œuvre de Marcel Aymé, je trouve ma matière dans la période de l'Occupation, traité sous forme de récits à mi- chemin entre le conte fantastique et le conte philosophique. Recueil dont la nouvelle éponyme a pour héros un homme capable de passer au travers du mur.","Le Passe-muraille"],["D273242","dev","Femme célèbre, née en 1721, fille d'un financier, j'ai notamment été représentée par Quentin de La Tour et François Boucher. Épouse du financier Lenormant d'Étioles, je me lie à Fontanelle et Crébillon. Devenue la maîtresse du roi dont je conserverai toujours l'amitié, je me fais détester par la Cour et me trouvant en butte à de nombreuses cabales. Favorite de Louis XV, de mon vrai nom Jeanne-Antoinette Poisson.","Madame de Pompadour"],["D6e521a","dev","Bâtiment parisien reconstruit dès 1885, je conserve ma chapelle du 17ème siècle où se trouve le tombeau du cardinal de Richelieu. Comportant une bibliothèque riche de plus de 2 millions d'ouvrages, je fus conçu pour abriter de très nombreuses salles de conférence et d'examen. Situé dans le 5ème arrondissement, je comprends une dizaine d'amphithéâtres, une université du Quartier Latin devant mon nom au théologien Robert de Sorbon.","La Sorbonne"],["D4b8a2b","dev","Réalisateur né en 1932, j'ai présenté mon film de fin d'études \"Le Rouleau compresseur et le violon\" à l'institut national de la cinématographie. Cinéaste soviétique héritier de l'ancienne culture russe, j'ai réalisé huit longs métrages empreint de mysticisme dont \"Le Miroir\". Obtenant en 1962 le Lion d'Or à Venise pour mon premier film \"L'Enfance d'Ivan\", j'ai remporté le Grand Prix à Cannes pour \"Solaris\" en 1972.","Andreï Tarkovski"],["D361bdb","dev","Objet, dont un modèle spécial est dit \"d'Archimède\", je permets de lancer un jeu pratiqué à Paris au 16ème siècle. Traditionnellement confectionné dans du buis, représentant parfois un personnage grotesque, je suis constitué de deux parties reliées par une cordelette. Objet en vogue à la cour d'Henri III comprenant une boule creusée d'une cavité que l'on projette en l'air avant de la rattraper au moyen d'un pied pointu.","Le Bilboquet"],["D0a1001","dev","Actrice américaine née en Septembre 1972, je débute au cinéma en 1991 dans \"Shout\" puis incarne Wendy dans \"Hook\" de Steven Spielberg. A l'affiche de \"Jefferson à Paris\" de James Ivory en 1995, l'année suivante j'incarne la femme de Brad Pitt dans \"Se7en\". Couronnée par un Oscar pour mon rôle dans \"Shakespeare in Love\", je suis également à l'affiche de trois films de la saga \"Iron Man\" et \"Avengers: Infinity War\" en 2018.","Gwyneth Paltrow"],["D1d0e09","dev","Couleur dont le nom est originaire du grec, je suis utilisée avec le rouge pour les lunettes permettant aux spectateurs de visionner les films tournés en 3D. Constituant avec le jaune, le noir et le rouge ou magenta l'une des couleurs utilisées en imprimerie pour les procédés de quadrichromie, je suis une teinte qui oscille entre le bleu et le vert et se rapproche de la couleur turquoise. Tirant mon nom du grec \" kuanos\".","Le Cyan"],["Dd7e19a","dev","Ville française dans laquelle est né le dramaturge Bernard-Marie Koltès, je fus la capitale de l'Austrasie sous mes Mérovingiens. Située à environ 320 km à l'est de Paris, j'habite les Trinitaires, un lieu culturel installé dans un ancien couvent ainsi que depuis 2010, un musée présentant une partie des collections du centre Georges Pompidou. Chef-lieu du département de la Moselle habité par les Messins.","Metz"],["D318ea5","dev","Poète né à Paris en 1842, je connais une existence morne de professeur d'anglais en Provence avant de gagner Paris. Auteur du poème \"Brise Marine\", je revendique la nécessité d'une œuvre d'accès difficile parce qu'ambitieuse. Célébré par Joris-Karl Huysmans dans le roman \" À rebours\", je disparais à 56 ans après la parution du poème \"Un coup de dés jamais n'abolira le hasard\". Auteur de \"L'Après-midi d'un faune\".","Stephane Mallarme"],["Db56837","dev","Expression invariable suivant les mots \" à tue- tête \" dans le titre d'un poème de Jacques Prévert présenté comme une chanson, je fais partie d'un verbe signifiant \"boiter\". Généralement employé avec les verbes \"aller\" ou \"sauter\" je suis associé à la manière dont on effectue le parcours dans le jeu de la marelle. Expression courante décrivant l'action d'avancer en tenant un pied en l'air et en sautant sur l'autre.","A Cloche-pied"],["D578ea9","dev","Site naturel culminant à 348 mètres, ma propriété a été rétrocédée en Octobre 1985 au peuple des Anangu par le gouvernement du pays où je suis situé. Consistant en un inselberg (un sommet isolé), je suis une colline de grès de 9 km de circonférence aux parois ravinées dont les teintes de rouge changent au cours de la journée selon la lumière du soleil. Site sacré des aborigènes d'Australie pour qui je suis le centre du monde.","Ayers Rock, Uluru"],["Da529e4","dev","Film américain de 2005 dans lequel Freddie Highmor joue à nouveau aux cotés de Johnny Depp, je plonge cinq enfants dans un univers fantastique. Montrant comment quatre d'entre eux sont éliminés à cause de leur défaut, bien qu'ils aient gagné un ticket d'or, je vois le succès d'un enfant pauvre choisi comme héritier par Willy Wonka. Film de Tim Burton adapté d'un roman de Roald Dahl se passant dans une fabrique de confiserie.","Charlie et la Chocolaterie"],["D25b5a1","dev","Objet que les galériens n'ont plus le droit de porter dès 1793 après que la Convention Française m'ait décrété emblème du civisme et de la liberté, je figure au-dessus du faisceau du licteur alors symbole de la République. Porté par Louis 16 en 1792 quand la foule envahit les Tuileries, j'ai été souvent placé au bout d'une pique. Coiffure de couleur rouge emblématique de la Révolution Française représentée sur la tête de la Marianne.","Le Bonnet Phrygien"],["Da39773","dev","Ville d'Allemagne, grand centre économique et financier, je suis située à une trentaine de kilométriques au nord-ouest de Cologne. Berceau de la plus ancienne école d'art d'Europe ouverte en 1773, j'ai vu naître le philosophe Jürgen Habermas, l'écrivain Heinrich Heine et le cinéaste Wim Wenders. Capitale de la Rhénanie-du-Nord-Westphalie abritant le club sportif du Fortuna située à l'embouchure de la rivière qui me donne mon nom.","Düsseldorf"],["D04d037","dev","Boisson traditionnelle élaborée à partir des feuilles d'un arbuste ayant pour nom scientifique \"Ilex paraguariensis\", ma culture a été développée par les jésuites. Boisson tonique énergétique dont les indiens guaranis enseignèrent l'usage aux conquistadors, je suis riche en caféine. Boisson chaude très appréciée en Argentine, préparée et bue dans une petite calebasse à l'aide d'une pipe appelée bombilla.","Le Mate"],["Dbbf779","dev","Arbre de la famille des fagacées, cultivé depuis la préhistoire, je fleuris de juin à août; commun dans les pays méditerranéens et jusqu'au Caucase, je peux être atteint par la maladie de l'encre; le cynips et le balanin sont mes parasites; mon bois est la troisième essence de bois exploitée en France; mon fruit, récolté en octobre, se trouve dans une bogue piquante renfermant 2 à 3 châtaignes.","Le Chataignier"],["D0f2718","dev","Ville de 122 000 habitants, je suis la seule à être citée dans l'hymne national de mon pays bien que je n'en sois pas la capitale; mon nom signifierait « gué de la Meuse »; centre important de tannerie au Moyen-âge, époque où fut construit mon Pont Saint-Servais, je suis une ville des Pays-Bas, chef-lieu du Limbourg, connue grâce à un célèbre traité sur l'Union Européenne signé en 1992.","Maastricht"],["D1599d4","dev","Oiseau de la famille des Sulidés, piscivore, grégaire, j'ai un vol puissant et plane en cas de vent fort; mesurant 90 cm, je possède un plumage blanc, un bec gris tirant sur le bleu et des pattes palmées; plus grand oiseau marin d'Europe, on peut me rencontrer sur les côtes de l'Atlantique Nord; très présent en Bretagne, mon nom fait allusion à l'île de Bass, d'où je suis originaire.","Le Fou de Bassan"],["De106d8","dev","Né en 1913, diplômé en Histoire et Sciences politiques et en droit, je suis affecté à des missions d'espionnage pendant la Seconde guerre mondiale; incarné par Liam Neeson, dans le film The silent Man en 2017, je suis un agent du FBI, informateur clandestin à l'origine de la révélation de l'affaire du Watergate; mon vrai nom est William Mark Felt, mais je suis surtout connu par mon pseudonyme à connotation sexuelle.","Gorge Profonde, Deep Throat"],["D16abc8","dev","Mot figurant sur une bulle sur la couverture du huitième album d'une BD publiée en 1970, je suis associé à un personnage masculin apparu en 1957. Abréviation formée à partir de deux mots, je suis dite dans les situations qui dépassent le héros un employé de bureau paresseux et distrait du journal de Spirou imaginé par Franquin. Expression favorite de Gaston Lagaffe constituée de 6 lettres et d'une apostrophe.","M'enfin"],["D9b87cf","dev","Vêtement tel que celui en dentelle blanche portée par Shy'm au début du clip officiel de sa chanson \"Tourne\", je suis désigné par un mot anglais. Pouvant être en Jean ou en coton léger, moulant ou un peu plus large, je suis surtout porté l'été car je laisse les jambes et les cuisses découvertes, mais je suis également mini vert avec des collants opaques. Vêtement plus court que le bermuda dans ma version dite \"mini\".","Le Short"],["D3d68a0","dev","Geste technique d'un sport collectif portant le nom d'un engin de locomotion, je suis appelé \"chilena\" ou \"chalaca\" en Amérique du Sud. Consistant en un tir de volée en extension amorcé dos au but dans lequel l'impulsion et le tir sont réalisés avec la même jambe, j'ai été accompli par Klaus Fischer en demi-finale de la Coupe du monde en 1982 et par Cristiano Ronaldo en 2018. Geste spectaculaire du football.","La Bicyclette"],["D39f118","dev","Mot choisi par le groupe U2 comme titre de leur album studio sorti en 1997, je suis une abréviation anglo-américaine généralement associée au mot \"musique\". Défini différemment selon pays, je désigne un vaste ensemble de musiques pouvant être issues du Rock et du Jazz ou pouvant être uniquement assimilé à de la variété. Mot de trois lettres se lisant dans les deux sens, associé au titre de roi pour Michael Jackson.","La Pop"],["Da8c653","dev","Ville européenne où l'on peut voir l'église Notre-Dame du Finistère, j'ai fêté en 1979 le millénaire de ma fondation. Ville d'art dont le centre historique est appelé \" Pentagone\", j'ai inspiré des chansons à Dick Annegarn et à Jacques Brel. Lieu où les visites viennent visiter le musée Magritte ou photographier le Manneken-Pis et flâner sur la Grande Place avec ses maisons de corporation, je suis la capitale de la Belgique.","Bruxelles"],["D8981c9","dev","Coureur cycliste né en 1974. Je remporte le championnat du monde du kilomètre à 18 ans et celui des séniors en 1993 et 1994 avant d'être sacré champion olympique sur cette distance à Atlanta Reconverti dans les épreuves de vitesse, je deviens le français le plus titré de l'histoire du cyclisme sur piste. Parti à la retraite en 2004, j'intègre en 2018 la commission des athlètes du comité Paris 2024.","Florian Rousseau"],["D785cb4","dev","Durée pouvant être linéaire ou cyclique. Je suis défini par Spinoza comme l'attribut sous lequel nous concevons l'existence infinie de Dieu. Désignée par un terme emprunté au latin chrétien évoquant l'idée d'une vie future, je ne peux être appréhendée par l'expérience humaine car je n'ai ni commencement ni fin et échappe à toute détermination chronologique. Synonyme d'un temps très long dans le langage courant.","L'eternite"],["D1d7ad0","dev","Type de primates, dont une espèce vivant au Japon est la plus septentrionale de tous les singes, j'appartiens à la famille des Cercopithecidés. Singe mesurant environ 50 centimètres de long, je suis répandu en Asie, de l'Inde jusqu'au Japon ainsi qu'en Afrique du Nord. Vivant surtout à la lisière des forêts en sociétés hiérarchisées, je suis représenté par une espèce dite \"Rhésus\" qui a donné son nom à un système de groupes sanguins.","Le Macaque"],["D9bfdb1","dev","Documents désignés par une locution dont l'un des termes est issu du latin signifiant \"souffrir\", notre usage remonte en 1484. Rédigés par les 3 ordres de l'ancien régime en France, puis présenté au roi par les députés, nos exemples les plus célèbres sont ceux de 1789 résumés devant l'assemblée constituante par le comte de Clermont-Tonnerre. Cahier qui consignait les vœux et les réclamations du peuple français.","Les Cahiers de Doleances"],["Deef2c0","dev","Effet désigné par un mot emprunté à l'anglais en 1922 qui a la particularité de se lire dans les deux sens, je suis employé au cinéma ou dans un spectacle. Pouvant être verbal ou visuel, je consiste souvent en des répliques ou des péripéties inattendues, soit en des jeux de scènes burlesques qui ont été exploités par Buster Keaton ou Jerry Lewis par exemple. Effet comique rapide soudain associé au mot \"Running\" lorsqu'il est répété.","Le Gag"],["Ddb3bd0","dev","Ville de Grande-Bretagne dont le nom est associé au mot \"vieillard\" dans un roman de Gonzague Saint Bris paru en 2002, je suis située entre le massif des South Downs et la Manche. Lieu où est lancée au 18ème siècle la mode des bains de mer en Angleterre, je suis célèbre pour ma jetée, mon pavillon royal. Construit dans un style oriental, mes ruelles animées et mes monuments de type régence. Ville du Sussex de l'Est.","Brighton"],["Dae86bd","dev","Episode de la mythologie grecque qui a inspiré un poème à l'écrivain Coluthus au début du sixième siècle, je trouve mon origine dans un événement m'étant déroulé après les noces de Thétis et Pélée. Survenant alors que le roi de Spartes Ménélas assiste en Crète aux funérailles de Catrée, je suis un voyage en bateau qui ramène en Asie mineure mes deux protagonistes. Rapt commis par Pâris à l'origine de la guerre de Troie.","L'enlevement ou le Rapt D'helene"],["D61acfe","dev","Forteresse bâtie dans une ville conquise par François Ier en 1536, je me trouve aux débouchés du Val Cluson et j'ai été française à plusieurs reprises. Servant de prison d'Etat au 17ème siècle, j'ai eu pour gouverneur monsieur de Saint-Mars, et prisonnier le futur duc de Lauzun. Située en Italie dans le Piémont, je suis l'endroit où serait mort Nicolas Fouquet. Forteresse dans laquelle l'Homme au masque de fer a été emprisonné.","La Forteresse de Pignerol"],["De7a530","dev","Technique ayant donné naissance à une épreuve devenue olympique en 1956, j'ai été utilisée pour la première fois en 1927 par l'allemand Erich Rademander. Style de nage nécessitant un mouvement d'ondulation des jambes jointe à l'eau et une projection simultanée des bras vers l'avant au-dessus de la surface de l'eau, l'un de mes grands spécialistes était l'américain Mark Spitz. Style de nage dérivé de la brasse.","Le Papillon, la Nage Papillon"],["D041b1a","dev","Costume adopté le 13 Mai 1801 sur décision de Bonaparte, un échantillon de mon tissu d'origine est conservé aux archives nationales de France. Tenue officielle portée lors des séances solennelles ou des cérémonies de prestige, je suis réalisé sur mesure et consiste en un habit de drap brodé d'une branche d'olivier en soie et complété d'une épée. Revêtu par chaque nouveau membre nommé sous la coupole de l'Académie française à Paris.","L'habit D'academicien ou Vert"],["Df2eb25","dev","Représentation dont un des noms signifie \"cercle\" en sanskrit, mon exécution obéit à des règles de temps et de lieu. Commune à la plupart des traditions indiennes, je suis utilisé comme support de méditation dans le tantrisme. Diagramme symbolique qui peut être représenté sous une forme architecturale ou picturale, ou peut être réalisé avec du sable de couleur sur le sol alors dispersé dans l'eau à la fin du rituel.","Un Mandala ou un Yantra"],["De34584","dev","Entreprise publique francophone à caractère culturel, mon origine remonte à une loi de 1930 qui m'a créée sous le sigle INR. Symbolisé par un logo dit \"oreille\" jusqu'en 2005, mon identité visuelle actuelle est constituée de mon nom suivi d'un point et des lettres be. Totalement indépendante de ma tutelle la communauté française de Belgique, je diffuse quatre chaînes de télévision et cinq stations de radio.","La Rtbf, la Radio-television Belge de la Communaute Française"],["D753cab","dev","Archipel de l'Atlantique nord d'une superficie d'environ 1400 km², j'ai subi l'influence de plusieurs peuples dont les norvégiens qui m'ont colonisé vers 800. Bénéficiant depuis 1948 d'une autonomie locale, je suis formé de 18 îles dont la principale Strømø ou Streymoy abrite ma capitale Tórshavn. Territoire insulaire situé à 350 km au nord de l'Ecosse, ma principale activité reste la pêche. Archipel danois.","Les Iles Feroe"],["D1b24f3","dev","Oiseau échassier à pattes noires ayant pour nom scientifique Platalea leucorodia, je fais partie de la même famille que l'ibis et mesure environ 80 cm de long. Me nourrissant dans l'eau peu profonde des étangs et des marais, je vole le cou tendu comme un cygne mais ressemble de loin à une aigrette avec mon plumage tout blanc et ma crête hirsute. Oiseau devant mon nom commun à mon long bec aplati noir à bout jaune.","La Spatule"],["D92caa5","dev","Peintre français né en 1819, j'expose au Salon de 1844 \"L'homme au chien\" issu d'une série d'autoportraits. Abandonnant le style romantique de mes débuts, je deviens bientôt le chef de file du réalisme avec des tableaux tels que \"Les Cribleuses de blé\" \"L'atelier du peintre\" et \"Un enterrement à Ornans\" qui fait scandale en 1850. Peintre de \"L'origine du monde\", ayant pris une part active à la Commune de Paris.","Gustave Courbet"],["D081a18","dev","Rappeur américain né en 1971 près de Los Angeles sous le nom de Calvin Cordozar Broadu. Prenant mes distances avec le gangster rap après la mort de Tupac Shakur en 1996, je publie cette année-là mon deuxième album \" Tha Doggfather\" après \"Doggystyle\". Rappeur à l'allure nonchalante animant depuis 2016 une émission de cuisine décalée, j'ai joué le rôle de Huggy-les-bons-tuyaux dans un remake de Starsky & Hutch.","Snoop Dogg"],["De8e75c","dev","Sportif né à Niš, j'ai été champion du monde de mon sport avec Barcelone, Kiel et Montpellier le club de mes débuts. Élu meilleur joueur du monde de ma discipline en Mars 2017 pour la troisième fois de ma carrière, j'évolue dans mon sport collectif au poste d'arrière gauche ou de demi-centre où ma puissance physique et mon charisme peuvent s'exprimer. Handballeur français, quadruple champion du monde évoluant en club au PSG.","Nikola Karabatic"],["D5af217","dev","Fruit d'un arbre de la famille des rutacées dont le nom désignait aussi au 18ème siècle une boubonnière à l'intérieur tapissé d'écorces d'oranges séchées, je suis principalement cultivé en Calabre. Petit agrume à la pulpe très acide, je suis produit par un arbre qui serait un hybride issu du citronnier et du bigaradier. Fruit dont l'écorce au parfum suave sert à aromatiser le thé.","La Bergamote"],["D2bf6e7","dev","Mot issu du moyen néerlandais signifiant \"Ouvrage de madriers\", j'ai désigné au Moyen- Age un ouvrage de défense consistant à un rempart. Voyant mon sens évolué avec l'aménagement à Paris sous Louis XIV d'une voie plantée d'arbres à l'emplacement des enceintes de Charles V et de Louis XIII, je désigne aujourd'hui également une large voie entourant une ville. Synonyme d'avenue et de cours associé au mot périphérique.","Le Boulevard"],["Dec60ad","dev","Matière ayant été fabriquée et commercialisée en France sous cette forme qu'à partir de 1770, je permets de confectionner des objets décoratifs de qualité qui résistent aux rayures et qui sont translucides à faible épaisseur. Obtenue en mélangeant du feldspath, du quartz et du kaolin, je suis cuite à température très élevée avant d'être décorée et recuite à petit feu ou à grand feu. Matière céramique dite \"à pâte dure\".","La Porcelaine"],["D264dcd","dev","Usage ayant été interdit le 8 Novembre 1793 dans les administrations françaises où on me remplaça par mon contraire, je pose souvent problème aux étrangers parlant la langue française. Dépendant de l'âge et du contexte, considéré comme une marque de respect envers un interlocuteur, je suis courant vis-à- vis des inconnus mais suis devenu rare dans certains milieux professionnels. Consistant à s'adresser à quelqu'un en lui disant \"VOUS\".","Le Vouvoiement"],["D4280e8","dev","Tube étranger de l'année 1977, j'ai été repris 25 ans plus tard en duo avec la chanteuse française Lena Ka et sert de fond musical à une scène avec Monica Belluci dans le film \"Astérix et Obelix: Mission Cléopâtre\". Vendu à 1 million d'exemplaires ce qui a permis à mon interprète italien de se faire connaître en France, je comprends 57 fois la même déclaration d'amour. Slow d'Umberto Tozzi dont le titre signifie \"Je t'aime\".","Te Amo"],["D77d447","dev","Personnalité née à Paris en 1634, de mon vrai nom Marie-Madeleine Pioche de La Vergne, ma famille était proche du cardinal de Richelieu. Femme de lettres, réputée pour mon érudition, j'ai fréquenté mademoiselle de Scudéry, Jean de la Fontaine et fût intime avec La Rochefoucauld. Auteur de \"La Princesse de Montpensier\", mon roman \"La Princesse de Clèves\", considéré comme le modèle du roman d'analyse a connu un vif succès.","Madame de la Fayette"],["D0d20cd","dev","Particularité physique à laquelle Jacques Antoine Dulaire a consacré l'ouvrage \"Pogonologie\" en 1786, j'ai fait l'apologie de l'abbé Burchard au 12ème siècle. Particularité masculine interdite au corps enseignant sous le Second Empire en France, je peux marquer une appartenance politique ou religieuse. Revenue à la mode au 21ème siècle permettant de limiter la fréquence du rasage et de jouer avec la pilosité du visage, avec l'affluence des barbiers.","La Barbe"],["Dd7d120","dev","Ville d'Algérie appelée \"Fort Laperrine\" sous le gouvernement français, située sur la route d'In Salah, j'étais autrefois visitée par les touristes européens avant d'attirer la bourgeoisie d'Alger, d'Oran et de Constantine. Ville de garnison et d'immigration malienne élevée au rang de wilaya et de préfecture, je reste associée au père de Foucauld. Ville du Sahara algérien dans le massif du Hoggar appelée \"Tamenɣest\" en berbère.","Tamanrasset"],["D6040b7","dev","Artiste né en 1760, mort à 89 ans; J'ai adopté une cinquantaine de signatures différentes et exploré de nombreux styles et techniques durant ma longue carrière. Artiste asiatique célèbre pour la qualité et l'abondance de mes illustrations xylographiques, j'ai révélé l'art japonais. Auteur de l'album \" Trente-six vues du mont Fuji \" qui s'ouvre sur l'estampe célèbre intitulée \" La Grande Vague de Kanagawa \".","Katsushika Hokusai"],["Dda66c7","dev","Pays s'étendant sur 148.000 km² dont le drapeau formé de deux bandes bleues et d'une bande blanche est orné de triangle, j'abrite les deux plus grands lacs d'Amérique centrale. Montagneux au nord et au centre avec notamment la cordillère Isabella, je dispose d'une frontière avec le Honduras et le Costa- Rica. Etat bordé à l'ouest par l'océan pacifique et à l'est par la Mer des Caraïbes, ma capitale est Managua.","Le Nicaragua"],["Dcb5744","dev","Chanson de l'album \"Various Positions\" sortie en 1984, j'ai notamment été reprise par Alexandra Burke. Apparentée à un gospel associant référence biblique et allusion aux relations amoureuses, j'ai été citée par le premier ministre canadien Justin Trudeau en hommage à mon auteur. Chanson de Leonard Cohen dont Jeff Buckley a livré une interprétation mémorable, mon titre est un cri de louange de la liturgie juive et chrétienne.","Hallelujah"],["D842570","dev","Héroïne prénommée Jane, je suis apparue en 1928 dans une série de nouvelles. Préfigurée par le personnage de Caroline Sheppard, sœur du narrateur dans \"dans Le Meurtre de Roger Ackroyd\", je suis une vieille dame anglaise passionnée d'ornithologie et de jardinage qui résout des énigmes criminelles sans quitter son petit village de St. Mary Mead. Héroïne d'Agatha Christie qui renonça à me faire mener l'enquête dans \" Mort sur le Nil\".","Miss Marple"],["D28c64c","dev","Bois tiré d'un arbre d'Amérique tropicale dont le nom scientifique est \"Ochroma lagopus\", j'ai une teinte ivoire avec des nuances plus brunes. Servant notamment pour les pales des éoliennes, j'ai une structure en nid d'abeille et ne suis pas très toxique en cas d'incendie. Bon isolant thermique et phonique, je permets de créer pour le cinéma des objets qui se brisent facilement. Bois extrêmement léger utilisé notamment en modélisme.","Le Balsa"],["D4bafea","dev","Ville de 400.000 habitants en 2018, je me suis développée autour du fort Alexandria fondée en 1838. Ancien lieu de villégiature impériale puis de la Nomenklatura communiste, j'abrite une résidence officielle où Vladimir Poutine reçoit ses homologues étrangers. Station balnéaire du Caucase sur la mer noire, j'ai accueilli avec ma station de ski de Rosa Khutor après d'immenses travaux pharaoniques, les Jeux Olympiques d'Hiver de 2014.","Sotchi"],["D407445","dev","Homme de sciences né en 1822, j'ai mené pendant huit ans des recherches ayant abouti à la formulation de trois lois qui ne furent redécouvertes qu'en 1900. Occupant d'abord mes loisirs à des recherches sur la météorologie et l'apiculture, je mène par la suite une série d'expérimentations sur l'hybridation des pois dont je croise méthodiquement les lignées. Botaniste et religieux autrichien fondateur de la génétique.","Johann Gregor Mendel"],["Dfb834c","dev","Genre de plantes originaire d'Asie, d'Océanie, d'Afrique, mon espèce Syriacus également appelée Althéa est bien connue en Europe pour être acclimatée au 18ème siècle. Appartenant à la famille des malvacées, je suis représenté en Afrique par l'oseille de Guinée ou karkadé où mes fleurs servent à préparer une infusion appelée Bissap. Genre comptant de nombreuses espèces ornementales aux grandes fleurs de couleur.","L'hibiscus"],["D6b476f","dev","Comportement ou trait de caractère qui se réduit au gène DRD4-7R-L lié à l'impulsivité et les réactivités agressives, le dramaturge Richard Brinsley Sheridan a dit de moi qu'il est impossible d'avoir de l'esprit sans exprimer ce qui me caractérise. Pouvant être pathologique mené au sadisme ou ordinaire face à l'hostilité, je suis illustré par le Loup dans \"Le Petit Chaperon rouge\" ou par Dark Vador dans \"Star Wars\". Opposé à la gentillesse.","La Mechancete"],["Dc90f87","dev","Sportif né en 1929, je pratique plusieurs sports dont le hockey sur glace avant de me consacrer au football que je débute dans le club de Krasny Bogatyr. Quintuple champion d'Union Soviétique entre 1954 et 1963 avec le club du Dynamo Moscou, j'ai remporté avec l'équipe d'URSS le premier Euro de football en 1960. Seul gardien de but de l'histoire à avoir reçu le ballon d'or, j'ai été surnommé \"L'araignée noire\".","Lev Yachine"],["D0a3fda","dev","Formation végétale occupant 150.000 km² à l'échelle mondiale, on me trouve notamment dans le golfe de Guinée. Zone végétale caractérisée par un manque d'oxygène au ras du sol et une forte salinité de mes eaux, je suis essentiellement colonisé par des arbres à racines aériennes et verticales comme le palétuvier. Forêt littorale dense protégeant la côte de l'érosion et formant un écran contre les cyclones.","La Mangrove"],["Deb7e41","dev","Vertébré ayant pour nom scientifique \"Carassius auratus\", je compte plus de 300 variétés dont celles dites \"Oranda\", \"Shubunkin\" ou \"Pearlscale\". Appartenant à la famille des Cyprinidae, mesurant 15 à 20cm de long, je suis originaire de Chine où j'ai fait l'objet de nombreux croisements. Poisson d'aquarium constituant l'animal domestique le plus vendu dans le monde.","Le Poisson Rouge"],["D9867cc","dev","Catégorie d'hommes de l'antiquité romaine désignée par une locution latine, j'exerce un droit à la la Patria Potestas qui ne s'éteint qu'à ma mort. Seul individu juridiquement autonome de la Domus, je détenais en théorie droit de vie et de mort sur ma femme, mes enfants et mes esclaves. Chef d'une famille à Rome dont le nom aujourd'hui est appliqué à un père de famille très autoritaire.","Le Pater Familias"],["D881eb8","dev","Chanteur né en 1933 en Géorgie, je suis condamné à l'âge de 16 ans à 4 ans de pénitencier pour vol. libéré grâce au musicien Bobby Byrd dont j'intègre le groupe « The flames », j'enregistre dès 1956 « Please please please » puis « Try me » mon premier tube. Incarné par Chadwick Boseman en 2014 dans le film « Get on up », je suis surnommé « Mister Dynamite » ou « Le parrain de la Soul ». Chanteur de « I feel good » et de « Sex Machine ».","James Brown"],["Dfde5a1","dev","Manifestation ayant vu le jour en 1898 au Jardin des Tuileries en France, j'avais attiré alors 140.000 visiteurs avant de m'installer au Grand-Palais puis à la porte de Versailles. Présenté comme le plus grand salon de ma catégorie, je me tiens en alternance avec celui de Francfort depuis 1976. Présentant les évolutions technologiques de différents constructeurs automobiles, mon édition 2018 a ouvert ses portes le 04 Octobre.","Le Salon de L'automobile"],["Dc82d6a","dev","Peuple parmi les plus anciens de l'humanité, mes membres ne sont devenus les citoyens à part entière dans leur pays qu'après un référendum en 1967. Chasseurs, cueilleurs, semi-nomades, nous nous sommes installés sur notre territoire il y a 50.000 ans environ. Spirituellement liés à la terre, à la faune, à la flore, nos mythes sont connus sous le nom de \"Temps du rêve\". Habitants originels de l'Australie.","Les Aborigenes"],["Dd1b2c6","dev","Pratique récente, encore peu connue et utilisée, je suis écologique puisque je n'émets pas de pollution liée à la cadavérine et à la putrescine, et évite la dispersion des cendres. Processus de transformation du corps d'un défunt par les micro-organismes dans un compost de bois et de broyats végétaux; au bout d'un an, la dépouille est transformée en matière riche, saine et fertile; tirant mon nom du mot humus.","L'humusation"],["D9aafd4","dev","Ayant lieu 2 fois par an, j'aurais été proposé une première fois par Benjamin Franklin qui souhaitait profiter un maximum du soleil; en 1916, je suis appliquée pour économiser du charbon et le redistribuer à l'effort de guerre. Je suis alors mis en service jusqu'en 1939; supprimé puis instauré à nouveau en France en 1976 afin d'économiser l'énergie; survenant le dernier dimanche de mars et le dernier dimanche d'octobre.","Le Changement D'heure"],["D7df4df","dev","Spécialité servie traditionnellement lors des fêtes religieuses, on me consommait lors de la Maslenitsa pour fêter le retour du soleil que je symbolise par ma forme et ma couleur; fabriqué avec de la farine, du levain et de l'eau, je peux être mangé nature ou tartiné avec du caviar; variété de galette épaisse, proche de la crêpe, mon nom issu du slave ancien signifie moudre; spécialité Russe.","Le Blini"],["Dffee4e","dev","Sport dont le nom figure dont l'intitulé de ma fédération nationale française la FFME, je suis pratiqué en plein air ou sur une structure artificielle. Apparu en France sous ma forme sportive dans les années 1970, je me suis ensuite démocratisé grâce à Patrick Edlinger. Ayant pour objectif d'atteindre le sommet de voies ou bien de blocs ne dépassant pas 4 mètres de hauteur en évoluant à mains nues sans aide matérielle.","L'escalade"],["Df41bf7","dev","Personnage de la Genèse, second fils de Judas et frère de Er; je refuse de féconder ma belle- sœur devenue veuve pour assurer une descendance à mon père, ce qui déplût à Dieu; mon crime, qualifié de vice abominable au concile de Trente en 1885, a inspiré Dali dans sa toile le Grand Masturbateur; ayant donné mon nom en 1712 au terme onanisme.","Onan"],["D55820e","dev","Romancière étrangère née en 1942, je me consacre également à la fondation que j'ai créée avec les droits d'auteur de polar pour venir en aide aux femmes et aux enfants en difficulté. Ayant écrit une vingtaine de livres traduits dans de nombreuses langues, j'ai évoqué ma vie en exil dans mon pays réinventé. De nationalité chilienne et américaine ayant rencontré le succès en 1982 avec \"La maison aux esprits\", elle est la nièce de l'ancien dirigeant Salvador Allende.","Isabel Allende"],["D80ac03","dev","Au Moyen-âge, je désignais le langage secret utilisé par brigands, voleurs et marchands ambulants, j'ai une fonction utilitaire visant à l'efficacité et une fonction identitaire car je suis généralement incompréhensible par les non-initiés; j'ai pour exemples le globish, le lunfardo argentin ou le louchébem des bouchers parisiens au 19ème siècle; militaire, informatique ou du marketing, je suis un sociolecte, c'est-à-dire un parler spécifique lié à une profession.","Le Jargon"],["D6d7d8b","dev","Massif montagneux long de 240 km, culminant au Goljam Perelik, je suis le lieu d'un important culte Orphique; je possède des vallées profondes comme celle de la Maritsa, des cirques, grottes et sites archéologiques comme Perperikon, on peut m'admirer depuis la ville de Plovdiv; m'étendant sur une partie de la Bulgarie jusqu'au nord de la Grèce, mon nom vient d'un mot Thrace se traduisant par « eau rougeâtre ».","Les Rhodopes"],["Dee6c27","dev","Coureur cycliste, ayant débuté ma carrière professionnelle en 2005; excellent descendeur, bon rouleur, je me distingue dans plusieurs courses, dont le tour de Lombardie que je remporte en 2015; comptabilisant 9 apparitions sur les podiums lors de grandes courses, dont la Vuelta que je remporte en 2010, le Tour de France en 2014; j'intègre l'équipe Bahraïn merida en 2017; surnommé le Requin de Messine, prénommé Vincenzo.","Nibali"],["Dbe2bf9","dev","Fichier, institué, en France, en 1850 par le magistrat Arnould Bonneville de Marsangy afin de lutter contre les récidives; pouvant être transmis à d'autres pays européens dans le cadre du programme ECRIS, je suis régi par le code de la procédure pénale; j'ai pour objectif de mémoriser les condamnations d'un individu prononcées par des juridictions; qualifié de vierge pour une personne n'ayant jamais été condamnée.","Le Casier Judiciaire"],["D5fcc7e","dev","Petit d'un animal élevé pour ma viande et ma peau que l'on utilise notamment pour la fabrication d'articles de mode; appelé Antenais lorsque je suis âgé de 1 à 2 ans, j'entre dans la préparation de plats comme l'asado Argentin et le navarin; connu pour mon espèce de pré-salé, je suis un symbole de l'innocence; ma gestation dure 5 mois et précède ma mise à bas appelée agnelage.","L'agneau"],["D16fc54","dev","Courant né dans les années 1970 ayant notamment inspiré le livre « Voyage au bout de la solitude » dont le film « Into the Wild » est une adaptation; en France, on me rapproche plus de l'autonomie que du concept d'apocalypse; mes membres, les Preppers, pratiquent des activités les préparant à une catastrophe de grande ampleur; les crises économiques et écologiques ont contribué à mon développement; de la même famille que « survivre ».","Le Survivalisme"],["Dea1149","dev","Accessoire dont le premier modèle européen serait dû à un professeur de lycée Ecossais, James Pillans, en 1850; rencontrant alors un certain succès auprès des élèves pour mon côté novateur, j'aurais eu pour effet d'accentuer leur motivation; tombant en désuétude progressivement remplacé par des outils numériques, j'ai pour ancêtre les tablettes d'argiles et l'ardoise; panneau de bois peint, sur lequel on écrit des données temporaires avec une craie.","Le Tableau Noir"],["Dbc36e2","dev","Danse qui trouverait mon origine chez les immigrés Irlandais qui utilisaient leurs sabots pour communiquer entre eux; j'ai été pratiquée par les esclaves noirs comme dans le film Stormy Weather; William Lane fut un pionnier du genre; me répandant dans les années 1900 grâce aux vaudevilles et plus encore grâce au jazz, je me danse avec des chaussures sous lesquelles sont fixées des fers; indissociable de Fred Astaire.","Les Claquettes"],["Db25fcb","dev","Médecin et homme politique né sous le patronyme de Pieterz en 1593 dans une famille de commerçants, je côtoie de nombreux savants et publie une pharmacopée et des ouvrages de descriptions anatomiques; bourgmestre d'Amsterdam, j'encourage une politique sanitaire et procède à des dissections publiques pour former les chirurgiens; une de mes leçons d'anatomie a été représentée par Rembrandt sur un tableau de 1632; connu sous un nom dérivé de tulipe.","Nicolaes Tulp"],["D25f97b","dev","Seul drapeau à être carré avec celui du Vatican à la différence de ceux des autres membres des Nations-Unies, ma forme a été fixée par un décret de l'assemblée fédérale de 1889. Ayant pour origine la nécessité de rassembler sous un même emblème les troupes engagées dans la bataille de Laupen en 1339, je dérive de la bannière des montagnards du canton de Schwytz.","Le Drapeau Suisse"],["Dc7b4d6","dev","Ensemble d'opérations militaires dont l'art est appelé \"Poliorcétique\", je me fais plus rare au 18ème siècle car je nécessite de grands moyens. Pouvant durant des mois, je me fonde sur l'attente de l'armée et j'ai longtemps été mené par des catapultes et échelles destinés à monter à l'assaut des murailles. Opération consistant à cerner une ville.","Le Siege"],["D879dad","dev","Eglise édifiée à l'origine par l'empereur Constantin à la demande de sa mère Sainte Hélène, j'ai été plusieurs fois détruite ou incendiée au cours des siècles. Surmonté de deux coupoles dont celle du Catholicon, je suis construite à Jérusalem à l'endroit où selon la tradition Jésus aurait été crucifié et enseveli. Constituant le lieu le plus important de la chrétienté et un lieu de culte pour plusieurs confessions chrétiennes.","L'eglise du Saint-sepulcre"],["D643cb3","dev","Objet usuel dont l'invention remonte au Néolithique, j'étais alors fabriqué en os; accessoire de toilette réservé à l'aristocratie chez les Égyptiens et les Assyriens, je suis fabriqué en ivoire, en corne et suis parfois incrusté d'argent au 17ème siècle; tirant mon nom du latin pecten, je suis un objet à dents fines et serrées, aujourd'hui élaboré en écaille ou en plastique et sers à démêler et retenir les cheveux.","Le Peigne"],["D7ecaa6","dev","Fleuve ayant un bassin de plus de 800 000 km², je suis utilisé pour la navigation, la production d'hydroélectricité et l'irrigation, et traverse plusieurs pays dont l'Allemagne où je prends ma source; coulant entre les Carpates et les Balkans, je me termine par un immense delta débouchant sur la mer noire; passant à Belgrade et à Budapest, Johann Strauss me met à l'honneur dans l'une de ses œuvres.","Le Danube"],["D9d9b1f","dev","Né en 1861, je suis un symbole national de mon pays; auteur, philosophe, peintre et musicien, mon recueil le plus célèbre, l'Offrande lyrique, a été traduit par André Gide et plusieurs de mes nouvelles ont été adaptées au cinéma par Satyajit Ray; manifestant mon soutien à Gandhi, c'est moi qui lui aurais donné son surnom de Mahatma; auteur indien, prix Nobel de littérature en 1913, prénommé Rabindranath.","Tagore"],["Db19465","dev","Signe de ponctuation qui serait issu de la notation musicale; ma première utilisation connue remonte à 1399 dans un manuscrit de l'humaniste Florentin Coluccio Salutati; employé également en mathématiques et dans la publicité, j'apparais dans d'autres cas pour signaler un danger; en bande dessinée, je sers à exprimer la surprise; autrefois appelé point d'admiration, je sers dans un texte à marquer l'admiration ou l'exaspération nommé clam en typographie.","Le Point D'exclamation"],["D1fc29c","dev","Métier quasiment disparu, ceux qui m'exerçaient passaient leur temps dans une pièce où ils pouvaient manger, lire ou tricoter en attendant d'intervenir; figure emblématique à partir des années 1950, la première à m'exercer fut Suzy Wincker dès 1935; incontournables jusque dans les années 1980, mon rôle était d'annoncer les programmes à venir; mes plus fameux représentants sont Catherine Langeais, Jacqueline Joubert ou plus récemment, Olivier Minne.","Speakerine"],["D549775","dev","Né en 1479, je suis un personnage historique dont le surnom peut désigner aussi un objet utilisé en bijouterie pour mesurer le diamètre d'une bague; j'apparais dans un film de Georges Méliès en 1907; ayant vécu à la cour de François 1er qui me condamna au bannissement, mon vrai nom est Nicolas Ferrial; bouffon, personnage principal de la pièce de Victor Hugo, le Roi s'amuse.","Triboulet"],["D03d1b2","dev","Accessoire dont le plus vieux modèle daterait de 1830, les amérindiens me taillaient dans du bois; je prends mon essor avec la naissance d'un sport collectif né dans les années 1850 au Canada; je me compose d'un manche de 1m50 environ prolongé par une partie incurvée en kevlar ou en graphite; bâton recourbé avec lequel les hockeyeurs dirigent le palet; je peux désigner aussi un accessoire épiscopal.","La Crosse"],["Db0f6ea","dev","Découvert au 18ème siècle par le prêtre dominicain Fransisco Ximenez, mon nom en quiché signifie Livre de la natte; rédigé au 16ème siècle, je comporte 4 parties, la première commente la genèse de l'univers, et la seconde narre les aventures d'Hun Ahpu et Xbalanqué, deux jumeaux luttant contre les forces de la vie et de la mort; traduit en français par l'Abbé Brasseur, je suis le livre sacré des Mayas.","Le Popol Vuh"],["D8c3edd","dev","Petit état d'Europe orientale indépendant depuis 1275, je compte 642 000 habitants et ma monnaie est le khôr; traversé par deux fleuves, le Wladir et Moltus, et par la chaîne montagnes des Zmylpates, je suis une monarchie où Tintin se rend pour la première fois dans l'album Le Sceptre d'Ottokar; ma capitale est Klow; Hergé a formé mon nom à partir de deux syllabes empruntées à Transsylvanie et Moldavie.","La Syldavie"],["D57682d","dev","Petite île de 10 km de long sur 4 km de large, j'abrite les monts Otemanu et Pahia. Constitué d'un volcan vieux de quelques millions d'années, je suis célèbre pour mes cocotiers et mon rôle de base américaine pendant la seconde guerre mondiale. Située en Polynésie française près de Tahiti, mon nom formé d'un mot redoublé est associé à la ville de Vaitape.","Bora-bora"],["D7bd3da","dev","Athlète française née en Novembre 1974, j'ai fait mes débuts en compétition internationale aux JO de Barcelone avant d'être notamment entraînée par Claude Monot puis par François Pépin. Originaire du Sierra Léone, j'ai disputé des duels acharnés avec la suédoise Carolina Klüft. Championne du monde d'heptathlon en 1999, de saut en longueur en 2003, je suis toujours détentrice des records de France dans cette discipline.","Eunice Barber"],["Dd00ce3","dev","Denrée alimentaire de consommation courante, ma présentation typiquement française a été réalisée en 1850 par l'épicier Eugène François grâce à l'utilisation d'une scie. Obtenu en associant ma matière première cristallisée à de l'eau, je suis alors moulé et mis à sécher. Produit le plus souvent de forme rectangulaire ou carré destiné à être plongé dans le thé ou le café et parfois contenu dans un sucrier.","Le Carre de Sucre, le Sucre En Morceaux"],["Dbaa3e1","dev","Texte législatif comptant 27 articles, j'ai été publié le 17 Septembre 1787. N'ayant pas cherché contrairement à la France à reproduire le système britannique et son régime parlementaire qui centralisait la souveraineté, j'ai été acceptée par une convention réunie à Philadelphie. Comptant parmi les plus anciennes constitutions écrites encore appliquées, j'ai été adopté par un pays qui fête son indépendance un 04 Juillet.","La Constitution des Etats-unis"],["D8cd79a","dev","Type de peinture usé par Francesco Guardi pour réaliser « Le portique vénitien » exposé au Musée Jacquemart-André, je comprends généralement de la gomme arabique et de la glycérine. Pouvant être éclairci en mélangeant du blanc à la couleur choisie, je donne un rendu pâteux et opaque. Type de peinture utilisée dans le cadre scolaire disponible sous forme de pastilles ou de tubes.","La Gouache"],["Dbe7ac4","dev","Lac situé à 1133 mètres d'altitude, d'une profondeur maximale de 80 mètres, je reçois les eaux de nombreuses rivières dont la Kagera. Deuxième lac du monde en superficie découvert par John Hanning Speke en 1858, j'ai été déséquilibré par l'introduction de la jacinthe d'eau et de la perche du Nil. Lac d'Afrique partagé entre l'Ouganda, le Kenya et la Tanzanie; alimentant le Nil, je porte le nom d'une reine britannique.","Le Lac Victoria, Nyanza"],["Def9e67","dev","Personnage d'une bande dessinée incarné par Éric Judor en 2004, j'ai fait ma première apparition dans un album de 1958. Aîné d'une fratrie apparentée à des personnages réels, je suis d'un caractère agressif et poursuit deux idées fixes: Braquer les banques et abattre Lucky Luke. Plus petit des cousins Dalton, je me mets dans des colères contre mes frères ou les gardiens du pénitencier dont il ne cesse de s'évader.","Joe Dalton"],["Dec291e","dev","Pays dont la partie Nord-Ouest comprend la région appelée « Kisalföld », ayant comme point culminant « Le Kékes », mes touristes peuvent profiter de ma très ancienne tradition des salons de thé et visiter les grottes d'Aranka. Situé en Europe centrale, traversé par le Danube, un de mes sites célèbres est le lac Balaton. Pays où l'on pourra déguster une goulache, ma capitale est Budapest.","Hongrie"],["D841cda","dev","Pièce de vêtement pour lequel William Lee créa un métier à tricoter vers 1589, j'étais autrefois coupée dans de la toile ou de la laine grossière appelée Etam. Souvent noir au 19ème siècle, et de teinte claire en 1920, je suis traditionnellement confectionné en laine, en coton ou en soie et me vois démocratisé vers 1940 avec le nylon. Vêtement couvrant le pied et la jambe détrôné par le collant dans les années 60.","Le Bas"],["D938fd5","dev","Conflit déclenché par la saisie de 300 navires de commerce français par l'Angleterre, j'ai opposé la Grande-Bretagne et la Prusse à la France et ses alliés. Ayant eu entre autres la possession de la Silésie, j'ai été marqué par la défaite des troupes franco-autrichiennes à Rossbach en 1757. Guerre ayant abouti côté français à la perte du Canada et de la Louisiane, j'ai débuté en 1756 et me suis achevé en 1763.","La Guerre de Sept Ans"],["D2dfa2e","dev","Site d'Extrême-Orient, construit au 5ème siècle, ma première cour abrite une forêt de stèles dont celle montrant Bodhidharma traversant le Yangtse sur de la paille. Temple ayant connu de nombreuses destructions et attaques dont celle des Gardes Rouges dans les années 70, je suis le berceau des arts martiaux chinois, notamment le Kung-Fu. Monastère chinois situé dans la province du Henan, devenu un haut lieu du tourisme en Chine.","Le Temple ou Monastere Shaolin"],["Dfe3c12","dev","Groupe d'animaux constituant avec les tuniciers et les céphalocordés l'un des trois sous-embranchements des chordés, je suis caractérisé par une symétrie bilatérale et un épiderme stratifié. Me distinguant par un crâne et par au maximum deux paires de membres locomoteurs, je comprends aussi bien les reptiles que les oiseaux et les mammifères. Groupe d'animaux devant mon nom au squelette interne cartilagineux ou osseux.","Les Vertebres"],["D227f31","dev","Plante herbacée dont l'espèce cultivée est dite « usitatissimum » ce qui signifie « très utilisé », je suis connu depuis des millénaires. Cultivée dans toute l'Europe au Moyen-Age où mon industrie en textile employait une main d'œuvre nombreuse, plante aux longues tiges aux petites fleurs bleues ciel dont le nom a donné les mots linge, linceul, linotte.","Le Lin"],["D7c52ca","dev","Ensemble de pièces musicales dont la composition s'est échelonnée sur une période de 20 ans allant de 1827 à 1846, je suis l'œuvre d'un compositeur disparu à l'âge de 39 ans. Courts morceaux de caractère intimiste exécutés au piano, nous avons influencé Satie, Poulenc, Fauré. Composées par un musicien polonais et constituées d'une vingtaine de pièces, notre nom évoque ce qui est propre à la nuit.","Les Nocturnes (de Chopin)"],["D687568","dev","Type d'inscription au nombre de 18 dans « Les Œuvres » de Ronsard publié en 1560, je suis composé par l'intéressé ou par un autre. Parfois rédigé en latin, je peux m'adresser aux passants anonymes comme cela se faisait dans la Gaule romaine. Inscription ayant pour exemple celle de Scipion l'Africain « Ingrate patrie, tu n'auras pas mes os », je peux commencer par les mots « Ci-gît » ou « Ici repose ». Inscription figurant sur une tombe.","Une Epitaphe"],["D52f084","dev","Personnage de la mythologie grecque ayant échangé avec Ajax mon épée contre son baudrier après l'avoir affronté des heures durant dans un combat sans vainqueur, on me connait surtout dans mon rôle dans « L'Iliade ». Remarquable guerrier tuant de nombreux grecs défendant Troie, cité dont je dirige la défense, je suis le mari d'Andromaque, le frère de Paris. Héros troyen tué par Achille.","Hector"],["Dc54e6d","dev","Homme célèbre né le 30 Janvier 1968, j'ai été le porte-drapeau de la délégation espagnole lors des JO de Barcelone de 1992. Après avoir suivi une formation au sein des écoles militaires de mon pays, j'ai notamment fait des études à l'université de Georgetown à Washington où j'ai obtenu un Master spécialisé en relations internationales. Devenu roi d'Espagne en 2014 suite à l'abdication de mon père Juan Carlos.","Felipe 6"],["D9a9411","dev","Bruit produit par certains animaux dont le nom attesté dès 1545 dans un sens médical vient d'un verbe signifiant « faire entendre un son gravé continue », je n'ai le plus souvent aucun rôle de communication. N'étant pas considéré comme un chant, je suis causé par un mouvement plus ou moins rapide des ailes durant le vol. Bruit sourd et continue que font entendre les insectes tels que la guêpe et l'abeille.","Le Bourdonnement"],["D821cca","dev","Race de chien dont le numéro de standard est le 193, certains de mes représentants auraient accompagnés la future femme d'Henri Ier lors de sa venue en France au 11ème siècle mais je suis plus probablement apparu à Kazan vers 1566. Très bon chasseur, rapide comme tous les lévriers, je suis remarquable pour mon aspect aristocratique, ma haute taille, ma tête longue et étroite ainsi que mon pelage soyeux. Chien d'origine russe.","Le Barzoï"],["D8a9ac5","dev","Type de personne de sexe masculin, mon nom est cité dans le titre d'un feuilleton d'Erckmann et Chatrian publié dès 1872 dans le journal « Le Temps ». Qualifié d'un point de vue juridique par les adjectifs « consanguins » ou « utérins » si je n'ai qu'un seul parent en commun, je suis dit « germain » si je suis né des mêmes parents que la personne considérée. Membre d'une famille chantée par Maxime Le Forestier en 1971.","Le Frere"],["De7ed78","dev","Sportive française née en Septembre 1973, j'ai notamment été entrainée par Fernand Urtebise, Jacques Piasenta, Guy Ontanon et Stéphane Caristan. Obtenant mon premier record de France en 1997 lors d'un 200 mètres en salle, je réalise ma plus belle performance un an plus tard à Budapest en battant le record d'Europe du 100 mètres. Sprinteuse guadeloupéenne surnommée « La reine Christine », j'ai mis un terme à ma carrière en 2012.","Christine Arron"],["D492bdf","dev","Unité monétaire européenne, mes pièces ont été définies par la loi monétaire du 7 Mai 1850. Devise d'un pays où circulaient 860 monnaies différentes dans la première moitié du 19ème siècle, ma parité s'établit à environ 0,86 euros. Monnaie dont les billets représentent Le Corbusier, certaines de mes pièces figurent Helvetia, la mère patrie sur leur avers. Devise de la confédération helvétique.","Le Franc Suisse"],["D097691","dev","Personnalité de la musique classique née en 1908, j'ai laissé à ma mort en 1989 un millier d'enregistrements. Ayant dirigé en création « Le Triomphe d'Aphrodite » de Carl Orff, j'ai été directeur artistique du festival de Salzbourg et j'ai révélé des talents comme la violoniste Anne-Sophie Mutter. Chef d'orchestre autrichien nommé en 1955 directeur musical à vie de l'orchestre philarmonique de Berlin.","Herbert Von Karajan"],["D9b0a9a","dev","Sportif français, né le 17 Janvier 1966 à Rouen, je compte 33 titres de champion de France à mon palmarès. Champion d'Europe du 100 mètres en 1985, vice-champion du monde de natation l'année suivante, j'ai également été recordman d'Europe sous une distance en 1991. Ancien numéro 1 français de nage libre, médaillé de bronze sur 100 mètres lors des JO de Séoul en 1988 puis lors de ceux de Barcelone en 1992.","Stephan Caron"],["D03df29","dev","Institution dont on s'accorde à dater l'origine en 1229, j'ai été organisée par le pape Grégoire 9 et ma direction a été confiée aux religieux dominicains en 1232. Conduite par des personnages tels que Robert le Bougre en France, Conrad de Marbourg en Allemagne ou Tomás de Torquemada en Espagne, mes sentences étaient proclamées au cours d'un sermon public.","L'inquisition"],["Da7464e","dev","Evènement représenté par François-Louis Dejuinne sur un tableau commandé en 1837, j'ai fait suite au serment solennel d'un roi fait à la bataille de Tolbiac. Episode relaté par Grégoire de Tours dans son « Histoire des Francs », je suis survenu après la conversion d'un roi païen au christianisme. Evènement ayant eu lieu un 25 Décembre e la fin du 5ème siècle mettant en scène à Reims un roi des francs, son armée et l'évêque Rémy.","Le Bapteme de Clovis"],["Db3d2fb","dev","Pilote né le 03 Juillet 1987, j'ai reçu mon premier kart à l'âge de 03 ans en guise de cadeau de Noel. Disputant mon premier grand Prix de F1 en 2007, je termine 8ème du classement général la saison suivante avant de rejoindre Red Bull Racing en 2009. Pilote allemand devenu en 2010 le plus jeune champion du monde de l'histoire, j'ai remporté en 2013 mon quatrième titre de champion du monde de suite. Pilote de l'écurie Ferrari.","Sebastian Vetel"],["D6d7815","dev","Une phrase ayant donné son titre à un essai de Roland Barthes ainsi qu'à un livre de Jean- Pierre Gattégno, je suis tiré d'un roman français en trois parties publié à contes d'auteur. Phrase dans laquelle le narrateur parle à la première personne, j'introduis l'évocation de ses souvenirs d'enfance à Cambrai. Incipit du roman « Du côté de chez Swann » de Marcel Proust rappelant le moment où enfant, celui-ci se mettait au lit.","Longtemps Je Me Suis Couche de Bonne Heure"],["Db4c294","dev","Type d'objet, je porte un nom venu de l'ancien provençal « Capdel » qui désignait un ornement calligraphique ou de divertissement offert à une dame au 17ème siècle. Pouvant consister en un poisson vivant en Chine, mes parts de chaussures dont le symbole est médiatique dans ce pays, je suis présenté de deux mains et dans un emballage soigné au Japon. Objet offert pour un anniversaire, pour Noel ou pour les étreignes de fin d'année.","Un Cadeau"],["Dd51671","dev","Personnage de la mythologie grecque, époux de la Pléiade Mérope, je serais selon certains mythes le véritable père d'Ulysse. Me distinguant par ma ruse et mon ingéniosité, présenté comme le créateur des jeux isthmiques en honneur de mon neveu, je suis le fondateur de la ville de Corinthe. Fils d'Eole, condamné par Zeus à pousser éternellement un rocher.","Sisyphe"],["D0071af","dev","Poète et dramaturge français né en 1868, je suis issu de la bourgeoisie provinciale et je suis converti à la fois catholique le jour de Noel 1886 à Notre Dame de Paris. Devenu diplomate, j'occupe divers postes en Chine où j'écris le recueil « Connaissance de l'Est » et publie la pièce « Tête d'or » en 1890 et « Partage de Midi » en 1905. Auteur du « Soulier de Satin », de « L'annonce faite à Marie »","Paul Claudel"],["D8e2d26","dev","Méthode d'agriculture désigné par un mot probablement calqué sur l'Allemand et apparu en 1976, je repose sur des principes généraux énoncés par Rudolf Steiner. Me basant sur des pratiques agricoles durables en évitant la mécanisation, j'ai recours à des préparations à base de plantes, observe un calendrier tenant compte des influences des astres sur les êtres vivants. Particulièrement développée dans la production viticole.","La Biodynamique"],["Deb3465","dev","Mot servant de titre à une nouvelle publiée en 1884, je suis d'abord employé pour un raisonnement philosophique avant de prendre le sens courant d'alternative. Souvent mal orthographié car certains remplacent ms deux « m » par un m et un n, je désigne l'obligation de choisir entre deux possibilités comportant toutes deux des inconvénients. Mot associé au héros cornélien tel que Le Cid confronté à un choix difficile.","Dilemme"],["De237e7","dev","Chanson extraite de l'album « True Blue » sorti en 1987, je suis chantée en anglais et comprend quelques mots en espagnol. Débutant par « Como puede ser verdad », je suis une chanson dans laquelle Madonna rend hommage à la beauté et au mystère du peuple d'Amérique latine. Tube illustré par un clip dans lequel la chanteuse incarne à la fois une jeune femme réservée et pieuse et une danseuse de Flamenco revêtue d'une robe rouge.","La Isla Bonita"],["D246b30","dev","Ville des USA, j'abrite des bâtiments remarquables tels que la « Storer House » due à Franck Lloyd Wright, le musée « LACMA » de Renzo Piano ou encore le « Walt Disney Concert Hall » conçut par Franck Gehry. Longtemps caractérisé par l'absence de gratte- ciels et de véritables centres-villes, j'ai connu un renouveau urbanistique dans les années 1970. Ville de Californie m'étendant sur plus de 100 km, deuxième ville des USA.","Los Angeles"],["D6be710","dev","Personnage de la Bible, fils d'Anne et d'Elkana, je suis voué à Dieu dès mon enfance et élevé au temple de Silo. Juge itinérant menant Israël au combat contre les philistins, j'instaure la royauté en consacrant d'abord Saul qui sera rejeté par Dieu, et David que je choisis parmi les fils de Jesse. Personnage considéré comme le plus remarquable des juges et le premier des prophètes, mon nom signifie en hébreu « Son nom est Dieu ».","Samuel"],["Dbf471c","dev","Héros d'une pièce de théâtre publiée en 1897, je suis un homme cultivé n'ayant qu'un seul véritable ami, le docteur Astrov. Ayant passé ma vie à la campagne pour administrer le domaine familial, je me suis dévoué pour permettre au professeur Sérébriakov mon beau-frère de vivre à Pétersbourg avant de découvrir qu'l n'est qu'un homme prétentieux et égoïste. Héros, créée par Anton Tchekhov désigné en tant qu'oncle de Sonia.","L'oncle Vania"],["D30cee4","dev","Roman en langue anglaise publié en 1922 à Paris après interdiction d'extrait pour cause d'obscénité, je me déroule sur une seule journée, le 16 Juin. Ouvrage volumineux ayant la réputation d'être difficile à lire, j'ai donné naissance au festival du Blues Day du nom de mon personnage principal célébré à Dublin depuis 1954. Roman de James Joyce désigné sous le nom du héros de l'Odyssée dont je constitue une parodie.","Ulysse"],["D630abe","dev","Expression figurant dans le titre d'un film de 2006 de François Breniaux, j'aurais pour origine une coutume païenne de la Babylone antique. Constituant dès le 18ème siècle, le symbole traditionnel de l'amour quand il est heureux à ses débuts, on m'emploie également pour désigner une période d'entente cordiale entre deux personnes ou deux partis. Traduction de l'anglais « Honeymoon », je corresponds au premier temps du mariage.","La Lune de Miel"],["Da1b191","dev","Opéra en 3 actes crée en Janvier 1843, j'aurais été inspiré à mon auteur par un voyage mouvementé sur la mer Baltique. Drame fantastique allemand mettant en scène un marin condamné à errer sans fin sur les mers à moins de rencontrer une femme qui l'aimera, je m'inspire de la légende du Hollandais Volant. Opéra composé par Richard Wagner considéré comme sn premier chef-d'œuvre comprenant « La ballade de Senta »","Le Vaisseau Fantome"],["D4e185c","dev","Feuilleton français diffusé dès 1996, la chanson de mon générique est interprétée par Avy Marciano et due à Pascal Obispo et Lionel Florence. Constituant alors le programme hexagonal le plus vendu à l'étranger, je suis diffusé dans plus de 120 pays sous le nom de Saint-Tropez. Me déroulant sur la Côte d'Azur avec Bénédicte Delmas, Adeline Blandieau, Tonya Kizinger, j'ai été arrêté en 2008.","Sous le Soleil"],["D5b5806","dev","Substance aromatique extraite du laurier du Japon et synthétisé depuis les travaux d'Auguste Béhal, j'ai servi à produire dès le 19ème siècle une matière plastique élastique, le celluloïd. De couleur blanche translucide, je suis caractérisée par une odeur forte et procure un effet rafraichissant que l'on sent dans les pommades et les produits tels que le baume du tigre.","Le Camphre"],["D57bcab","dev","Etat d'Europe culminant au Korab à 2764 m, j'ai été colonisé dans l'Antiquité par les Grecs puis les Romains avant de passer sous la domination slave puis ottoman avant de devenir indépendant en 1912. Pays des Balkans, peuplé d'un peu plus de 3 millions d'habitants, je dispose d'une diaspora importante dans mes pays limitrophes tels la Macédoine, la Grèce, la Serbie et le Monténégro. Etat ayant pour capitale la ville de Tirana.","Albanie"],["D9c9937","dev","Tableau de Titien peint en 1538, ma scène est située dans la salle d'un palais où évoluent en arrière-plan, deux servantes affairées près d'un coffre ouvert. Montrant une jeune femme nue allongée sur un lit et devant un large pan de rideau sombre, la main gauche cachant son intimité, j'ai pour modèle un nu du peintre vénitien Giorgione. Tableau exécuté pour le futur duc d'Urbino et dont Edouard Manet s'est inspiré pour son œuvre « Olympia »","La Venus D'urbino"],["D1a8e59","dev","Document dont le format 99 mm sur 210 mm a été fixé par un arrêté du 1er Juin 2006, j'ai été créé en France en 1877. Devant être mis à jour par ms titulaires en cas de changement ou d'évolution de leur situation, je comprends des extraits d'actes d'Etat Civil. Document délivré gratuitement à la fin de la cérémonie du mariage civil.","Le Livret de Famille"],["Deabb0b","dev","Appareil dont deux modèles ont été installés au 2ème étage de la tour Eiffel, je comprends notamment un mât, un multiplicateur et une nacelle. Souvent installé en parc, je peux être de type terrestre et être dit « offshore » lorsque je suis installé en pleine mer. Machine permettant de transformer l'énergie cinétique du vent en énergie électrique.","L'eolienne"],["D0f06d3","dev","Métier autrefois appelé mandrier ou bergeolin, j'étais associé à un large parapluie et au bâton muni d'un crochet. Métier traditionnel nécessitant le sens de l'observation et la capacité d'établir un diagnostic vétérinaire, j'implique un mode de vie hors-norme et une certaine solitude. Personnage participant aux opérations de marquage pouvant assurer un agnelage et la responsabilité d'un troupeau de moutons.","Le Berger"],["D69c85e","dev","Footballeur ayant inscrit mon premier but en sélection nationale le 25 Mars 2016 lors de mon 25ème anniversaire, j'ai commencé ma carrière professionnelle à l'US Boulogne. Double champion d'Angleterre avec Leicester puis Chelsea, je suis considéré comme l'un des meilleurs à mon poste de milieu récupérateur. Apprécié pour mon humilité, je suis un des acteurs la victoire des français à la Coupe du Monde de 2018.","N'golo Kante"],["D768ab7","dev","Fleuve d'Amérique du Sud prenant ma source dans la Sierra de Tumucumaque à la frontière brésilienne, je suis long de 680 km. J'ai donné part à de nombreux rapides et abrite sur mes rives de nombreux groupes ethniques d'origine amérindienne comme les Paramaccans ou d'origine africaine à l'instar des Bonis. Fleuve tributaire de l'Atlantique formant la frontière entre la Guyane Française et le Suriname.","Le Maroni"],["D4adc18","dev","Mot servant de titre à un recueil du poème « Amour » dédié à mademoiselle Rachilde, je désigne une qualité d'une personne sensible, aimable ou bien d'un objet raffiné. Exprimant une idée de finesse par exemple pour un ouvrage, je fais notamment référence à l'attitude prévenante et pleine de tact envers quelqu'un, d'une personne ayant des sentiments élevés. Mot associé en 2009 à un roman de David Foenkinos.","La Delicatesse"],["Ddb6a07","dev","Plante désignée par le nom scientifique de « Vinca minor » mais également appelée « Bergère », je tapisse les ombrages et les lisières des bois ou des jardins. Ayant des feuilles persistantes brillantes, je suis reconnaissable à mes fleurs généralement d'un bleu plus ou moins violacé dont les cinq pétales soudés à la base sont découpés à l'oblique. Plante ayant donné mon nom à une couleur bleu clair tirant sur le mauve.","La Pervenche"],["D5803a3","dev","Ouvrage publié entre 1883 et 1885 sous-titré « Un livre pour tous et pour personne », j'ai inspiré une œuvre symphonique à Richard Strauss. Poème philosophique à la prose lyrique et visionnaire riche en symboles, j'exprime le refus de la morale judéo- chrétienne et la nécessité d'une transmutation générale des valeurs ainsi que la doctrine du surhomme. Œuvre de Friedrich Nietzsche.","Ainsi Parlait Zarathoustra"],["D045ea9","dev","Album de bande dessinée publié en 1934, mon titre fait implicitement référence à un établissement évoqué dans le film « Shanghai Express » de Joseph Von Sternberg. Album constituant de la vie humaine de mon auteur un tournant important dans ma carrière, je me déroule en Orient et raconte les agissements d'un trafiquant de drogue. Album d'Hergé décrivant également l'amitié naissante de Tintin et du jeune Tchang.","Le Lotus Bleu"],["D390794","dev","Animal représenté en Europe par un peu plus de 4.000 individus vivant en liberté ou en semi-liberté, on me trouve principalement en Pologne, Biélorussie Lituanie, Russie et en Ukraine. Mammifère faisant l'objet en France d'une trentaine d'élevages, de quelques réserves comme celles des Monts d'Azur, je compte une espèce américaine et une européenne. Grand bovidé reconnaissable à mon encolure bossue.","Le Bison"],["D9047c2","dev","Phrase latine constituant la devise du club de football d'Argentinos Juniors, j'ai été détourné par le baron Pierre de Coubertin. Figurant dans la dixième des seize satyres de Juvénal, je signifie à l'origine qu'il faut cesser d'implorer vainement les dieux et que la seule chose à leur demander est la santé physique et mentale. Devenue aujourd'hui une injonction à entretenir son corps tout autant que son esprit.","Mens Sana In Corpore Sano"],["D983b3a","dev","Artiste né vers 1416 à Borgo San Sepolcro, je suis formé à Florence par le peintre Domenico Veneziano. M'étant peut-être représenté endormi dans la fresque « La résurrection » qu'Aldous Huxley qualifia de plus belle peinture du monde, j'ai réalisé une œuvre dans laquelle domine le travail sur la construction géométrique de l'espace. Peintre mathématicien du Quattrocento, auteur des fresques de la basilique de de San Francesco d'Arezzo, mort deux jours avant la découverte par Christophe Colomb de l'Amérique.","Piero Della Francesca"],["D1ed546","dev","Type de lieu public inauguré en 1933 à Camden dans le New Jersey, je comptais plus de 5.000 établissements dans les années 50 avant de décliner peu à peu. Equipé d'un système de haut-parleur individuel et installé sur un Parking en éventail, j'ai été conçu par un vendeur de voitures installation de plein air permettant aux spectateurs d'assister à la projection d'un film sur écran géant tout en restant installés dans leur voiture.","Le Drive-in / le Cine-parc"],["D50f953","dev","Tragédie créée à Paris le 1er Janvier 1677, j'ai été momentanément en concurrence avec une autre pièce portant sur le même sujet, écrite par le jeune Pradon. Montrant l'égarement d'une femme qui avoue à sa nourrice Œnone la passion qu'il éprouve pour son beau-fils Hyppolite, je conduis à leur perte, les principaux personnages. Tragédie les plus jouées parmi les pièces de Racine ayant pour héroïne l'épouse de Thésée.","Phedre"],["D80cff8","dev","Instrument à vent, je compte une version soprano en Si bémol familièrement appelée « Carotte ». Instrument que Georges Bizet fut l'un des premiers à adopter. De construction métallique, met en printemps mon système de clé à la famille des bois dans laquelle je suis rangé, j'ai séduit des musiciens de jazz dont Stan Getz, John Coltrane. Devant mon nom au musicien belge qui m'a inventé, Adolphe Sax.","Le Saxophone"],["D7d6e5a","dev","Comédienne née en 1967 à Ladysmith au Canada, j'ai reçu le titre de « Comtesse de Giglio » en 2015 au Monténégro. Apparaissant au cinéma dans les films comme « Barb Wire » et « Scary Movie 3 », militant activement pour la défense de la cause animale notamment dans un discours à l'Assemblée Nationale de l'ONU en 2016. Actrice révélée par la série « Alerte à Malibu ».","Pamela Anderson"],["Dc80473","dev","Plante herbacée vivace de la famille des polygonacées, mon nom scientifique est « Rumex acetosa ». Pouvant atteindre un mètre de hauteur, je donne de petites fleurs rougeâtres disposées en grappes. Plante potagère dont les feuilles sont employées dans les soupes et les omelettes et accompagnant le poisson, je suis riche en acide oxalique. Reconnaissable à ma saveur acidulée et à mes feuilles proches de l'épinard.","L'oseille"],["D95d0d0","dev","Pièce de théâtre créée en 1730. Je commence par cette réplique de Silvia à sa suivante Lisette « Mais encore une fois de quoi vous mêlez-vous? Pourquoi répondre de mes sentiments? ». Montrant comment Arlequin se prend à rêver l'ascension sociale sous l'identité de Dorante, je suis fondée sur l'échange des rôles et des tenues entre maitre et domestique. Comédie de Marivaux, dont le titre associe un sentiment et le sort.","Le Jeu de L'amour et du Hasard"],["Dfb9ede","dev","Animal dont le nom issu du turc signifie « oreille noire », je suis très répandu dans le sud et l'est de l'Afrique et ma population est menacée en Inde. Félin long de moins d'un mètre à la robe fauve et au poitrail blanc autrefois utilisé pour la chasse aux oiseaux en Iran, je peux tuer des proies aussi grosses que le springbok. Doté de longues oreilles surmontées d'une touffe de poils aussi appelé « Lynx d'Afrique »","Le Caracal"],["Dbd97f2","dev","Quartier situé au nord de Charing Cross, ma place principale commandée en 1631 par le comte de Bedford s'inspire de la place royale à Paris et de la Casa Grande de Livourne. Abritant en 1661 mes marchés de fruits et légumes, je deviens dès le 18ème siècle un quartier de plaisir avec mes cafés et mes théâtres dont celui consacré plus tard à l'opéra qui porte mon nom. Quartier du centre de Londres.","Covent Garden"],["D63d735","dev","Film de science-fiction sorti en 1982, réalisé par Steven Lisberger, j'ai été produit par les studios Disney. Me déroulant dans des décors futuristes créés par le peintre Syd Mead et le français Mœbius qui a supervisé mon story- board et a créé les costumes des personnages évoluant dans un monde électronique. Film avec Jeff Bridges dans lequel des hommes sont projetés dans un ordinateur, j'ai connu une suite en 2011.","Tron"],["D0454ce","dev","Roi né en 1920 formé dans mon pays en Angleterre, j'accède au trône en 1936, l'année où est signé un traité avec les Britanniques. Tentant de neutraliser le parti nationaliste du WAFD, je suis forcé en 1942 par les Britanniques de prendre mon premier ministre Mustafa el-Nahhas Pacha que je rappelle au pouvoir en 1950. Roi d'Egypte renversé en 1952 par les groupes des officiers libres dont font partie Nasser et Sadate.","Farouk"],["Dd85abb","dev","Trouble d'une fonction du corps humain considéré comme « paroxystique » dans la maladie de Bouveret, je suis souvent bénin lorsque je suis dit « atrial » et débute dans les oreillettes. Qualifié par l'adjectif « sinusal » si je suis causé par un exercice musculaire, je suis dans certains cas traité par un médicament anti-arythmique. Accélération de la fréquence du battement du cœur au-delà de 11 impulsions.","La Tachycardie"],["D3e1cc9","dev","Médecin décédé en 1992, mon attachement à la langue française m'a conduit à publier « Une introduction au langage de la médecine » et à être élu à l'Académie Française. Créateur en 1955 des premiers services de néphrologie, j'ai réalisé cette même année le premier rein artificiel français. Ayant effectué en 1962 la première greffe du rein entre nos jumeaux, j'ai eu pour fils le chanteur Michel Berger.","Jean Hamburger"],["D04bd84","dev","Ouvrage publié en 1949, je suis divisé en deux tomes: « Les faits et les mythes » et « Les expériences vécues ». décrié par les intellectuels dont Albert Camus qui voit une insulte au mâle latin, j'ai été interdit par le Vatican. Traduit en anglais en 1953, c'est aux USA que je gagnerai mon statut de livre fondateur du féminisme. Essai de Simone de Beauvoir comprenant le postulat « On ne nait pas femme, on le devient ».","Le Deuxieme Sexe"],["D10358a","dev","Tableau commandé en 1586, je suis resté dans l'église de Santo Tomé à Tolède à laquelle j'étais destiné. Mesurant 4,88 mètres sur 3,60 mètres j'ai pour sujet un miracle survenu après la mort d'un chevalier. Divisé en deux parties, ma partie supérieure montre le ciel avec le Christ entouré de saints et d'anges et la partie inférieure, la Terre où des gentils hommes assistent à l'enterrement d'un noble espagnol. Œuvre du Greco.","L'enterrement du Comte D'orgaz"],["D6ccf49","dev","Ouvrage publié anonymement en 1688, je suis l'œuvre principale d'un auteur français qui en attendait si peu de succès qu'il en abandonna le produit de la vente à la fille de son éditeur. Accueilli triomphalement, j'ai été réédité neuf fois du vivant de mon auteur qui fut précepteur du duc de Bourbon. Œuvre du moraliste Jean de la Bruyère qui rassemble des maximes et les portraits de ses contemporains dépeints avec ironie.","Les Caracteres ou les Mœurs de Ce Siecle"],["D46747c","dev","Famille de plantes dicotylédones comprenant notamment la nepeta et la monarde, je compte environ 6000 espèces. Comprenant des variétés aromatiques annuelles ou vivaces, je peux prendre un aspect buissonnant et suis notamment représentée par la mélisse, la lavande ou le thym. Famille de plantes devant la plupart de mes noms au latin « Labium » signifiant « lèvre » en raison de la forme de mes pétales.","Les Labiacees / les Lamiacees / les Labiees"],["D373dbb","dev","Monument parisien qui fut terminé par l'architecte Jean-Louis Hulot qui fut consacré en 1919, je suis inspiré de l'église Saint-Front de Périgueux. Edifice de style romano- byzantin bâti à 129 mètres d'altitude, j'abrite une cloche de 19 tonnes appelée « La savoyarde » et possède un dôme s'élevant à 83 mètres. Eglise dominant la butte Montmartre, j'ai été construite à la fin du 19ème siècle sur les plans de Paul Abadie.","La Basilique du Sacre-cœur"],["D6bb6a0","dev","Américaine née en 1890, mon père surnommé « Honey Fitz » a été maire de Boston. Epousant un américain d'origine irlandaise Joseph qui fera fortune dans la finance, et donnera naissance à 9 enfants entre 1915 et 1932 dont certains firent carrière dans la politique. Ayant connu au cours de ma vie plusieurs tragédies comme la mort violente de 4 de mes enfants, je m'éteins à 104 ans. Mère du président Kennedy.","Rose Kennedy"],["Da81d47","dev","Artiste française née en 1907, fille d'un architecte croate, j'ai étudié à Paris les arts décoratifs et les Beaux-Arts. M'orientant vers la photographie, je me lie à Henri Cartier- Bresson et à Man Ray puis à Paul Eluard qui m'introduit auprès des surréalistes et me présente à Picasso dont je partage la vie de 1937 à 1945. Célèbre modèle de la toile « La femme qui pleure », mon nom véritable est Henriette Théodora Markovitch.","Dora Maar"],["D47de47","dev","Film de 1968, j'ai reçu en 2018 un hommage à Cannes en présence de mon acteur principal pour les 50 ans de ma sortie. Débutant dans le désert à l'aube de l'humanité lorsque des primates découvrent un monolithe noir et l'usage de la première arme, je me déroule principalement 4 millions d'années après dans un vaisseau spatial piloté par HAL 9000. Film de Stanley Kubrick alliant métaphysique et science-fiction.","2001, L'odyssee de L'espace"],["D737052","dev","Intellectuel français disparu en 2008, je suis l'auteur notamment du « Soleil cou coupé » en 1948 et de « La tragédie du roi Ch
